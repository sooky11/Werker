name: Desktop build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Installeer afhankelijkheden
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[desktop,gmail,outlook,dev]" pyinstaller

      - name: Tests
        run: python -m pytest -q

      - name: Bouw het programma
        run: python packaging/build.py

      # Start het gebouwde programma zonder venster en controleer dat de inbox laadt.
      - name: Zelftest (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WERKER_HOME: ${{ runner.temp }}/werker-zelftest
        run: |
          $p = Start-Process -FilePath dist/Werker/Werker.exe -ArgumentList "--zelftest" -Wait -PassThru
          Get-Content "$env:WERKER_HOME/werker.log" -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { exit 1 }

      - name: Zelftest (macOS)
        if: runner.os == 'macOS'
        env:
          WERKER_HOME: ${{ runner.temp }}/werker-zelftest
        run: |
          status=0
          dist/Werker.app/Contents/MacOS/Werker --zelftest || status=$?
          cat "$WERKER_HOME/werker.log" || true
          exit $status

      - name: Maak een archief (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/Werker -DestinationPath dist/Werker-windows.zip

      - name: Maak een archief (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent dist/Werker.app dist/Werker-macos.zip

      - uses: actions/upload-artifact@v4
        with:
          name: werker-${{ runner.os }}
          path: dist/*.zip
