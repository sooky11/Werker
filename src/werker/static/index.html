<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Werker · Inbox</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#b4532a">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
  :root {
    --bg: #f6f4f0;
    --surface: #ffffff;
    --surface-2: #faf8f5;
    --border: #e6e1d8;
    --text: #1f1c18;
    --muted: #6f6a60;
    --accent: #b4532a;
    --accent-soft: #f7e6dd;
    --ok: #2f7d4f;
    --ok-soft: #e1f2e8;
    --warn: #a86a00;
    --warn-soft: #fbefd6;
    --danger: #b3261e;
    --danger-soft: #f9dedc;
    --info: #3b6fb6;
    --info-soft: #e3edf9;
    --radius: 12px;
    --shadow: 0 1px 2px rgba(31, 28, 24, .06), 0 4px 16px rgba(31, 28, 24, .04);
    --font: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14120f;
      --surface: #1c1915;
      --surface-2: #221e19;
      --border: #332d26;
      --text: #f2ede6;
      --muted: #a39b8f;
      --accent: #e8805a;
      --accent-soft: #3a261d;
      --ok: #6cc08b;
      --ok-soft: #1d3327;
      --warn: #e6b04f;
      --warn-soft: #3a2f16;
      --danger: #f2877f;
      --danger-soft: #3d1f1d;
      --info: #8fb8ef;
      --info-soft: #1b2a3d;
      --shadow: 0 1px 2px rgba(0, 0, 0, .4);
    }
  }
  :root[data-theme="dark"] {
    --bg: #14120f; --surface: #1c1915; --surface-2: #221e19; --border: #332d26;
    --text: #f2ede6; --muted: #a39b8f; --accent: #e8805a; --accent-soft: #3a261d;
    --ok: #6cc08b; --ok-soft: #1d3327; --warn: #e6b04f; --warn-soft: #3a2f16;
    --danger: #f2877f; --danger-soft: #3d1f1d; --info: #8fb8ef; --info-soft: #1b2a3d;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4);
  }

  /* Drie weergavethema's; de kleuren en vormen staan hier, de indeling blijft gelijk. */
  :root[data-theme="editorieel"] {
    --bg: #f7f4ee; --surface: #fbf9f4; --surface-2: #f1ece2; --border: #e4ded3;
    --text: #1d1b18; --muted: #746c60; --accent: #8f6f32; --accent-soft: #efe6d2;
    --ok: #4f7a4a; --ok-soft: #e6efe2; --warn: #8f6f32; --warn-soft: #f3ead6;
    --danger: #a13d32; --danger-soft: #f6e1dd; --info: #3f6a8f; --info-soft: #e4ecf2;
    --radius: 4px; --shadow: none;
    --font: Georgia, "Times New Roman", serif;
  }
  :root[data-theme="donker"] {
    --bg: #0b0d10; --surface: #14171c; --surface-2: #1a1f26; --border: #23272f;
    --text: #f2f4f7; --muted: #7d8594; --accent: #4fd1c5; --accent-soft: #17303a;
    --ok: #4fd1c5; --ok-soft: #17303a; --warn: #f5b84b; --warn-soft: #3a2c12;
    --danger: #f2877f; --danger-soft: #3d1f1d; --info: #7ab4ff; --info-soft: #162a44;
    --radius: 14px; --shadow: 0 1px 2px rgba(0, 0, 0, .4);
    --font: -apple-system, "Segoe UI", Inter, Roboto, sans-serif;
  }
  :root[data-theme="zacht"] {
    --bg: #eef0f7; --surface: #ffffff; --surface-2: #f6f7fc; --border: #e3e5f2;
    --text: #1b1d2a; --muted: #656a82; --accent: #6150e6; --accent-soft: #ecebff;
    --ok: #1f9d6b; --ok-soft: #e3f6ee; --warn: #a25f00; --warn-soft: #fdf1dc;
    --danger: #d9415b; --danger-soft: #fde4e9; --info: #3b6fb6; --info-soft: #e3edf9;
    --radius: 18px; --shadow: 0 10px 30px rgba(40, 44, 90, .07);
    --font: Inter, -apple-system, "Segoe UI", Roboto, sans-serif;
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.5 var(--font); -webkit-font-smoothing: antialiased;
  }
  button, input, textarea, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .sr-only {
    position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap;
  }

  /* Topbar */
  header {
    position: sticky; top: 0; z-index: 10; height: 60px;
    display: flex; align-items: center; gap: 12px; padding: 0 20px;
    background: var(--surface); border-bottom: 1px solid var(--border);
  }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 650; letter-spacing: -.01em; }
  .brand-mark {
    width: 28px; height: 28px; border-radius: 8px; background: var(--accent);
    display: grid; place-items: center; color: #fff; font-size: 14px; font-weight: 700;
  }
  .search { flex: 1; max-width: 460px; margin-left: auto; position: relative; min-width: 0; }
  .search input {
    width: 100%; height: 36px; padding: 0 12px 0 34px; border-radius: 999px;
    border: 1px solid var(--border); background: var(--surface-2); outline: none;
  }
  .search input:focus { border-color: var(--accent); }
  .search::before {
    content: ""; position: absolute; left: 13px; top: 11px; width: 12px; height: 12px;
    border: 2px solid var(--muted); border-radius: 50%;
  }
  .btn {
    height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--border);
    background: var(--surface); font-weight: 550; white-space: nowrap;
    transition: background .15s, border-color .15s;
  }
  .btn:hover { background: var(--surface-2); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.primary:hover { filter: brightness(1.06); background: var(--accent); }
  .btn.ghost { border-color: transparent; background: transparent; color: var(--muted); }
  .btn.danger { color: var(--danger); }
  .btn.small { height: 30px; padding: 0 10px; font-size: 13px; }
  .btn:disabled { opacity: .5; cursor: default; }
  .btn.icon-btn { display: inline-flex; align-items: center; gap: 6px; }
  a.btn { display: inline-flex; align-items: center; text-decoration: none; color: inherit; flex: none; }
  .btn[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }

  /* Layout */
  .layout {
    display: grid; grid-template-columns: 220px minmax(300px, 380px) minmax(0, 1fr);
    height: calc(100vh - 60px);
  }
  nav {
    border-right: 1px solid var(--border); padding: 16px 12px; overflow-y: auto;
    background: var(--surface);
  }
  .nav-title {
    font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted);
    margin: 14px 10px 6px;
  }
  .nav-title:first-child { margin-top: 8px; }
  .nav-item {
    width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: 8px 10px; border: 0; border-radius: 8px; background: transparent; text-align: left;
  }
  .nav-item:hover { background: var(--surface-2); }
  .nav-item[aria-current="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .count {
    min-width: 22px; padding: 0 7px; border-radius: 999px; font-size: 12px; text-align: center;
    background: var(--surface-2); color: var(--muted); line-height: 20px;
  }
  .nav-item[aria-current="true"] .count { background: var(--surface); color: var(--accent); }
  .count.hot { background: var(--accent); color: #fff; }

  /* List */
  .list { border-right: 1px solid var(--border); overflow-y: auto; background: var(--bg); }
  .list-head {
    position: sticky; top: 0; padding: 14px 16px 10px; background: var(--bg);
    border-bottom: 1px solid var(--border); z-index: 1;
  }
  .list-head h2 { margin: 0; font-size: 16px; }
  .list-head p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
  .item {
    display: block; width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--border);
    background: transparent; padding: 14px 16px; position: relative;
  }
  .item:hover { background: var(--surface); }
  .item[aria-selected="true"] { background: var(--surface); }
  .item[aria-selected="true"]::before {
    content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--accent);
  }
  .item-top { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
  .item-sender { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text); font-weight: 600; }
  .item-subject { margin-top: 2px; font-weight: 550; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item-summary {
    margin-top: 2px; color: var(--muted); font-size: 13px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .unread-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); flex: none; }
  .chip-row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; align-items: center; }

  /* Chips */
  .chip {
    display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 9px;
    border-radius: 999px; font-size: 12px; font-weight: 600; background: var(--surface-2);
    color: var(--muted); border: 1px solid var(--border); white-space: nowrap;
  }
  .chip::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .chip.has-icon { height: 24px; padding: 0 10px 0 7px; }
  .chip.has-icon::before { display: none; }
  .chip .chip-icon { width: 14px; height: 14px; flex: none; }
  .chip.prijsvraag { color: var(--ok); background: var(--ok-soft); border-color: transparent; }
  .chip.afspraak { color: var(--info); background: var(--info-soft); border-color: transparent; }
  .chip.klacht, .chip.hoog { color: var(--danger); background: var(--danger-soft); border-color: transparent; }
  .chip.factuur { color: var(--warn); background: var(--warn-soft); border-color: transparent; }
  .chip.wacht { color: var(--accent); background: var(--accent-soft); border-color: transparent; }

  /* Icons (inline SVG, geen externe bibliotheek) */
  .icon { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .nav-item { gap: 10px; }
  .nav-label { display: inline-flex; align-items: center; gap: 10px; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .btn .icon { width: 16px; height: 16px; margin-right: 6px; vertical-align: -3px; }  .btn.icon-btn .icon { margin-right: 0; }

  /* Reader */
  .reader { overflow-y: auto; padding: 32px clamp(16px, 4vw, 56px) 72px; }
  .reader-inner { max-width: 720px; margin: 0 auto; }
  .reader-inner > * + * { margin-top: 0; }
  .empty {
    height: 100%; display: grid; place-items: center; text-align: center; color: var(--muted); padding: 24px;
  }
  .empty > div { display: grid; justify-items: center; gap: 6px; max-width: 320px; }
  .empty .empty-icon { width: 36px; height: 36px; color: var(--accent); margin-bottom: 6px; opacity: .85; }
  .empty h3 { color: var(--text); margin: 0 0 2px; font-size: 17px; }
  .empty p { margin: 0; font-size: 14px; line-height: 1.55; }
  .empty .btn { margin-top: 10px; }
  .reader h1 { font-size: 22px; line-height: 1.3; letter-spacing: -.015em; margin: 6px 0 16px; font-weight: 650; overflow-wrap: anywhere; }
  .meta { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; color: var(--muted); font-size: 13.5px; }
  .meta strong { color: var(--text); font-weight: 600; }
  .name { font-weight: 650; }
  .avatar {
    width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center;
    background: var(--accent-soft); color: var(--accent); font-weight: 650; flex: none;
  }
  .from { display: flex; gap: 12px; align-items: center; margin-bottom: 18px; min-width: 0; }
  .from > div:last-child { min-width: 0; }
  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 20px 22px; margin-bottom: 18px;
  }
  .card h3 { margin: 0 0 8px; font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 650; }
  .summary-text { margin: 0; font-size: 15px; }
  .body {
    white-space: pre-wrap; word-wrap: break-word; font-size: 15.5px; line-height: 1.75;
    max-width: 66ch; margin: 0;
  }
  .body.mt { margin-top: 10px; }
  .draft textarea {
    width: 100%; min-height: 180px; resize: vertical; padding: 14px 16px; border-radius: 10px;
    border: 1px solid var(--border); background: var(--surface-2); line-height: 1.6; outline: none;
  }
  .draft textarea:focus { border-color: var(--accent); }
  .draft textarea[readonly] { color: var(--muted); }
  .notice {
    display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: 10px;
    font-size: 14px; margin-bottom: 12px;
  }
  .notice > div { min-width: 0; }
  .notice.warn { background: var(--warn-soft); color: var(--warn); }
  .notice.info { background: var(--accent-soft); color: var(--accent); }
  .notice ul { margin: 4px 0 0; padding-left: 18px; }
  .notice .btn { margin-top: 8px; }
  .prev-body {
    white-space: pre-wrap; word-wrap: break-word; color: var(--muted); background: var(--surface-2);
    border-left: 3px solid var(--border); border-radius: 8px; padding: 10px 12px; margin: 0 0 12px;
    font-size: 14px; line-height: 1.6;
  }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; align-items: center; margin-top: 12px; }
  .actions .spacer { flex: 1; }
  .sent-note { color: var(--ok); font-weight: 600; margin: 0; }
  .hint { color: var(--muted); font-size: 13px; margin-top: 8px; }
  .hint.flush { margin-top: 0; }
  .link { color: var(--accent); text-decoration: none; font-weight: 650; }
  .link:hover { text-decoration: underline; }
  .back { display: inline-block; font-size: 14px; margin-bottom: 4px; }
  .mt { margin-top: 12px; }
  .seg { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
  .seg-btn {
    height: 30px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--border);
    background: var(--surface); font-size: 13px; font-weight: 550;
  }
  .seg-btn:hover { background: var(--surface-2); }
  .seg-btn[aria-pressed="true"] { background: var(--accent-soft); border-color: transparent; color: var(--accent); font-weight: 650; }
  .kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 8px 18px; margin: 0; }
  .kv dt { color: var(--muted); font-size: 14px; }
  .kv dd { margin: 0; overflow-wrap: anywhere; }
  .path-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 8px 0 0; }
  code.path {
    font: 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; background: var(--surface-2);
    border: 1px solid var(--border); padding: 4px 8px; border-radius: 8px; overflow-wrap: anywhere;
  }
  pre.xml {
    white-space: pre; overflow: auto; max-height: 420px; max-width: 100%; margin: 10px 0 0;
    background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px; padding: 12px;
    font: 12.5px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  .card-subtitle { margin: 14px 0 6px; font-size: 14px; font-weight: 650; }
  kbd {
    font: 12px var(--font); padding: 1px 6px; border-radius: 6px; border: 1px solid var(--border);
    background: var(--surface-2); color: var(--muted);
  }

  /* Activity */
  details.activity summary {
    cursor: pointer; font-size: 13px; text-transform: uppercase; letter-spacing: .06em;
    color: var(--muted); font-weight: 650;
  }
  .log-list { list-style: none; padding: 0; margin: 12px 0 0; font-size: 13px; color: var(--muted); }
  .log-list li { padding: 6px 0; border-bottom: 1px solid var(--border); overflow-wrap: anywhere; }
  .log-list strong { color: var(--text); font-weight: 600; }
  .log-time { margin-right: 10px; font-variant-numeric: tabular-nums; }

  /* Clients */
  .ident-list { list-style: none; padding: 0; margin: 0; display: grid; gap: 6px; }
  .tl-item {
    display: block; width: 100%; text-align: left; background: var(--surface-2);
    border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px;
  }
  .tl-item:hover { border-color: var(--accent); }
  .tl-item .item-top { color: var(--muted); }
  .tl-status { font-size: 12px; color: var(--muted); }
  .row-inline { display: flex; gap: 8px; align-items: center; }
  .row-inline .input { flex: 1; min-width: 0; }

  /* Forms */
  .input {
    width: 100%; padding: 9px 12px; border-radius: 10px; border: 1px solid var(--border);
    background: var(--surface-2); outline: none; line-height: 1.4;
  }
  .input:focus { border-color: var(--accent); }
  .input.pill { width: auto; height: 36px; padding: 0 12px; border-radius: 999px; }
  textarea.input { min-height: 96px; resize: vertical; }
  .field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; min-width: 0; }
  .field > label { font-weight: 600; font-size: 14px; }
  .check-label { display: flex; gap: 10px; align-items: center; font-weight: 600; font-size: 14px; cursor: pointer; }
  .check-label input { width: 18px; height: 18px; accent-color: var(--accent); margin: 0; }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 14px; }
  .settings-section { margin-bottom: 16px; }
  .section-title { margin: 0 0 4px; font-size: 16px; font-weight: 650; }
  .section-intro { margin: 0 0 14px; color: var(--muted); font-size: 14px; }
  .mailbox-card, .sub-card {
    border: 1px solid var(--border); border-radius: 10px; padding: 10px 14px 2px; margin: 0 0 12px;
    background: var(--surface-2); min-width: 0;
  }
  .mailbox-card legend, .sub-card legend { font-weight: 650; padding: 0 6px; font-size: 14px; }
  .form-footer { display: flex; justify-content: flex-end; margin-top: 8px; }

  /* Begin-kaart (eerste keer) */
  .setup-card {
    border: 1px solid var(--accent); background: var(--accent-soft); border-radius: var(--radius);
    padding: 16px 16px 14px; margin: 12px 12px 8px; color: var(--text);
  }
  .setup-card h3 { margin: 0; font-size: 16px; font-weight: 650; }
  .setup-card > p { margin: 2px 0 10px; font-size: 13px; color: var(--muted); }
  .setup-steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
  .setup-step {
    width: 100%; display: flex; align-items: center; gap: 10px; text-align: left;
    padding: 8px 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface);
    font-weight: 550; font-size: 14px;
  }
  .setup-step:hover { border-color: var(--accent); }
  .setup-num {
    width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; flex: none;
    background: var(--accent); color: #fff; font-size: 12px; font-weight: 700;
  }
  .setup-step .icon { margin-left: auto; color: var(--muted); width: 16px; height: 16px; }
  .setup-card .actions { margin-top: 8px; }

  /* Toast */
  .toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(20px);
    background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 10px;
    box-shadow: var(--shadow); opacity: 0; pointer-events: none; transition: .25s; max-width: calc(100vw - 32px);
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.error { background: var(--danger); color: #fff; }

  .loading { color: var(--muted); padding: 24px; font-size: 14px; }
  .list-empty {
    display: grid; justify-items: center; gap: 6px; padding: 44px 24px; text-align: center; color: var(--muted);
  }
  .list-empty h3 { margin: 0; font-size: 16px; color: var(--text); }
  .list-empty p { margin: 0; font-size: 14px; line-height: 1.55; max-width: 280px; }
  .list-empty .btn { margin-top: 12px; }
  .list-empty .empty-icon { width: 34px; height: 34px; color: var(--accent); opacity: .85; margin-bottom: 4px; }

  /* Herinneringen, rapporten, teamaccounts en AVG */
  .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; }
  .stat-grid .card { margin-bottom: 0; }
  .stat-value {
    font-size: 30px; font-weight: 650; letter-spacing: -.02em; line-height: 1.15;
    font-variant-numeric: tabular-nums; overflow-wrap: anywhere;
  }
  .stat-value.warn { color: var(--danger); }
  .stat-list { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 4px; font-size: 14px; }
  .stat-list li { display: flex; justify-content: space-between; gap: 12px; color: var(--muted); }
  .stat-list strong { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }
  .stat-hint { margin: 10px 0 0; font-size: 13px; color: var(--muted); }
  .user-row {
    display: grid; grid-template-columns: minmax(0, 1fr) 150px minmax(0, 1fr) auto;

    .user-row { grid-template-columns: 1fr; }

    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 30;

  body.has-undo .toast { bottom: 84px; }

  /* Categorie aanpassen */
  .intent-edit { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; }
  .intent-select {
    height: 28px; padding: 0 8px 0 10px; border-radius: 999px; font-size: 13px; font-weight: 600;

  .intent-select.afspraak { color: var(--info); background: var(--info-soft); border-color: transparent; }
  .intent-select.klacht { color: var(--danger); background: var(--danger-soft); border-color: transparent; }
  .intent-select.factuur { color: var(--warn); background: var(--warn-soft); border-color: transparent; }

  .snippet-option strong { display: block; font-size: 14px; font-weight: 600; }
  .snippet-option span {
    display: block; font-size: 13px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .snippet-pop .hint { margin: 6px 10px; }
  .counter { font-size: 12px; color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }

  /* Bijlagen */
  .att-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .att-item {
    display: flex; align-items: center; gap: 12px; padding: 8px 12px 8px 8px; min-width: 0;
    border: 1px solid var(--border); border-radius: 10px; background: var(--surface-2);
  }
  .att-thumb {
    width: 56px; height: 56px; object-fit: cover; border-radius: 6px; flex: none;
    border: 1px solid var(--border); background: var(--surface);
  }
  .att-icon {
    width: 56px; height: 56px; display: grid; place-items: center; flex: none; color: var(--muted);
    border-radius: 6px; background: var(--surface);
  }
  .att-info { flex: 1; min-width: 0; }
  .att-name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .att-meta { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; font-size: 13px; color: var(--muted); }

  /* Afzenderregels, AI-rapport */
  .rule-list { list-style: none; margin: 0; padding: 0; }
  .rule-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 10px 0; border-bottom: 1px solid var(--border); }
  .rule-row:last-child { border-bottom: 0; }
  .rule-row .grow { flex: 1; min-width: 160px; overflow-wrap: anywhere; }
  .table-wrap { overflow-x: auto; margin-top: 4px; }
  table.data { width: 100%; border-collapse: collapse; font-size: 14px; }
  table.data th, table.data td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  table.data th { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 650; }
  table.data td.num, table.data th.num { text-align: right; font-variant-numeric: tabular-nums; }
  table.data tr:last-child td { border-bottom: 0; }

  /* Responsive */
  @media (max-width: 1100px) {
    .layout { grid-template-columns: 200px minmax(280px, 340px) minmax(0, 1fr); }
  }
  @media (max-width: 860px) {

    nav {

    .list { border-right: 0; overflow: visible; }
    .list-head { position: static; }
    .reader { overflow: visible; padding: 20px 16px 60px; border-top: 1px solid var(--border); }
    .reader h1 { font-size: 20px; }
    .search { max-width: none; min-width: 0; }
    .hide-small { display: none; }
    .actions { justify-content: stretch; }
    .actions .spacer { display: none; }
  }
  @media (max-width: 560px) {
    .grid-2 { grid-template-columns: 1fr; }

  /* Zachte overgangen; uit voor wie beweging liever niet ziet. */
  @media (prefers-reduced-motion: no-preference) {
    .nav-item, .item, .btn, .seg-btn, .tl-item, .setup-step, .input {

(() => {

  /* Pictogrammen: vaste SVG-paden in de code, geen externe bibliotheek en geen innerHTML. */
  const ICON_PATHS = {

  const $ = (sel) => document.querySelector(sel);

  function h(tag, props = {}, ...children) {
    const node = document.createElement(tag);
    for (const [key, value] of Object.entries(props)) {
      if (value === undefined || value === null || value === false) continue;
      if (key === "class") node.className = value;
      else if (key === "text") node.textContent = value;
      else if (key.startsWith("on")) node.addEventListener(key.slice(2), value);
      else node.setAttribute(key, value === true ? "" : value);
    }
    for (const child of children.flat()) {
      if (child === null || child === undefined || child === false) continue;
      node.append(child instanceof Node ? child : document.createTextNode(String(child)));
    }
    return node;
  }

  async function api(path, options = {}) {
    const response = await fetch(path, {
      headers: { "Content-Type": "application/json" },
      ...options,
    });
    let data = null;
    try { data = await response.json(); } catch (_) { /* leeg antwoord */ }
    if (!response.ok) {
      const detail = data && data.detail;
      let message = response.statusText || "Er ging iets mis";
      let problems = [];
      if (typeof detail === "string") message = detail;
      else if (detail && typeof detail === "object") {
        problems = Array.isArray(detail.problems) ? detail.problems : [];
        message = detail.message || (problems.length ? "De factuur is niet geldig." : message);
      }
      const error = new Error(message);
      error.status = response.status;
      error.problems = problems;
      throw error;
    }
    return data;
  }

  function toast(text, isError = false) {
    const node = $("#toast");
    node.textContent = text;
    node.classList.toggle("error", isError);

    toast.timer = setTimeout(() => node.classList.remove("show"), 3200);
  }

  function formatTime(iso) {
    if (!iso) return "";
    const date = new Date(iso);
    const now = new Date();
    const sameDay = date.toDateString() === now.toDateString();
    return sameDay
      ? date.toLocaleTimeString("nl-NL", { hour: "2-digit", minute: "2-digit" })
      : date.toLocaleDateString("nl-NL", { day: "numeric", month: "short" });
  }

    if (!iso) return "";
    return new Date(iso).toLocaleString("nl-NL", { dateStyle: "long", timeStyle: "short" });

    const pad = (n) => String(n).padStart(2, "0");

    return (parts[0][0] + (parts.length > 1 ? parts[parts.length - 1][0] : "")).toUpperCase();
  }

  function displaySender(sender) {
    const match = sender.match(/^(.*?)\s*<([^>]+)>$/);
    if (match && match[1].trim()) return match[1].trim();
    return match ? match[2] : sender;
  }

  function intentChip(intent) {
    if (!intent) return null;
    const icon = TAB_ICONS[intent];
    if (!icon) return h("span", { class: `chip ${intent}` }, INTENT_LABELS[intent] || intent);
    return h("span", { class: `chip has-icon ${intent}` }, svgIcon(icon, "icon chip-icon"), INTENT_LABELS[intent] || intent);
  }

  function urgencyChip(urgency) {
    if (!urgency || urgency === "laag" || urgency === "normaal") return null;
    return h("span", { class: `chip ${urgency}` }, URGENCY_LABELS[urgency]);
  }

  function channelChip(channel) {
    if (!channel) return null;
    return h("span", { class: "chip", text: channelLabel(channel) });
  }

  function setReader(node) {
    const reader = $("#reader");
    reader.replaceChildren(node);
    reader.scrollTop = 0;
  }

  function loadingNode(text = "Laden…") {
    return h("div", { class: "loading", text });
  }

  function errorNode(title, message) {
    return h("div", { class: "empty" }, h("div", {}, h("h3", { text: title }), message));
  }

  /* ---------- navigatie ---------- */

  function navButton(label, hash, current, count = null, hot = false, icon = null) {
    return h("button", {
      class: "nav-item",
      type: "button",
      "aria-current": current ? "true" : "false",
      onclick: () => {
        if (location.hash === hash) onRoute();
        else location.hash = hash;
      },
    },
      h("span", { class: "nav-label" }, icon ? svgIcon(icon) : null, h("span", { text: label })),
      count === null ? null : h("span", { class: `count${hot && count > 0 ? " hot" : ""}`, text: count }),
    );
  }

  function renderNav() {
    const stats = state.stats || {};
    const counts = stats.intents || {};
    const total = Object.values(counts).reduce((a, b) => a + b, 0);
    const countFor = (tab) => {
      if (tab.id === "pending") return stats.pending ?? 0;
      if (tab.id === "ingepland") return stats.scheduled ?? 0;
      if (tab.id === "all") return total;
      return counts[tab.params.intent] || 0;
    };
    $("#nav").replaceChildren(...TABS.map((tab) => navButton(
      tab.label,
      `#${tab.id}`,
      state.listMode === "messages" && state.tab === tab.id,
      countFor(tab),
      tab.id === "pending",
      TAB_ICONS[tab.id],
    )), navButton("Herinneringen", "#herinneringen", state.listMode === "reminders", state.reminderCount ?? 0, true, "bell"),
    navButton("Rapporten", "#rapporten", state.listMode === "reports", null, false, "chart"));
    $("#nav-clients").replaceChildren(navButton("Alle klanten", "#klanten", state.listMode === "clients", null, false, "users"));
    $("#nav-peppol").replaceChildren(navButton("Peppol-facturen", "#peppol", state.listMode === "invoices", state.invoiceCount, true, "file"));
    $("#seg").hidden = state.listMode !== "invoices";
    if (state.listMode === "invoices") renderSegment();
    $("#settings-btn").setAttribute("aria-pressed", String(state.reader === "settings"));
  }

  function updatePlaceholder() {
    $("#q").placeholder = state.listMode === "clients" ? "Zoek klanten"
      : state.listMode === "invoices" ? "Zoek facturen"
      : state.listMode === "reminders" ? "Zoek herinneringen" : "Zoeken";
  }

  function currentTab() {
    return TABS.find((t) => t.id === state.tab) || TABS[0];
  }

  function highlightItems() {
    document.querySelectorAll(".item[data-id]").forEach((el) => {
      el.setAttribute("aria-selected", el.dataset.id === state.selected ? "true" : "false");
    });
    document.querySelectorAll(".item[data-client]").forEach((el) => {
      el.setAttribute("aria-selected", el.dataset.client === state.selectedClient ? "true" : "false");
    });
    document.querySelectorAll(".item[data-invoice]").forEach((el) => {
      el.setAttribute("aria-selected", el.dataset.invoice === state.selectedInvoice ? "true" : "false");
    });
    document.querySelectorAll(".item[data-reminder]").forEach((el) => {
      el.setAttribute("aria-selected", el.dataset.reminder === state.selectedReminder ? "true" : "false");
    });
  }

  /* ---------- berichtenlijst ---------- */

  async function loadList() {
    const loadId = ++state.loadId;
    const tab = currentTab();
    const params = new URLSearchParams(tab.params);
    if (state.query) params.set("q", state.query);
    $("#list-title").textContent = tab.label;
    try {
      const messages = await api(`/api/messages?${params}`);
      if (loadId !== state.loadId) return;
      state.messages = messages;
      renderList();
    } catch (error) {
      if (loadId !== state.loadId) return;
      $("#list-sub").textContent = `Kon de lijst niet laden: ${error.message}`;
    }
  }

  function listEmpty(tab) {
    if (state.query) {
      return h("div", { class: "list-empty" },
        svgIcon("mail", "icon empty-icon"),
        h("h3", { text: "Geen resultaten" }),
        h("p", { text: `Niets gevonden voor “${state.query}”.` }),
      );
    }
    if (tab.id === "pending") {
      return h("div", { class: "list-empty" },
        svgIcon("clock", "icon empty-icon"),
        h("h3", { text: "Alles is afgehandeld" }),
        h("p", { text: "Er wacht niets op jouw goedkeuring. Mooi werk." }),
      );
    }
    if (tab.id === "ingepland") {
      return h("div", { class: "list-empty" },
        svgIcon("calendar", "icon empty-icon"),
        h("h3", { text: "Niets ingepland" }),
        h("p", { text: "Er staan geen antwoorden ingepland." }),
      );
    }
    return h("div", { class: "list-empty" },
      svgIcon("mail", "icon empty-icon"),
      h("h3", { text: "Hier is het nog leeg" }),
      h("p", { text: "Er staan geen berichten in deze categorie." }),
      h("button", { class: "btn small", type: "button", onclick: () => $("#sync").click() },
        svgIcon("sync"), "Synchroniseer"),
    );
  }

  function renderList() {
    const tab = currentTab();
    const n = state.messages.length;
    $("#list-sub").textContent = n === 0
      ? (state.query ? "Geen resultaten" : "Niets hier")
      : `${n} ${n === 1 ? "bericht" : "berichten"}`;
    if (n === 0) {
      $("#items").replaceChildren(listEmpty(tab));
      placeSetupCard();
      return;
    }
    $("#items").replaceChildren(...state.messages.map((m) => {
      const selected = String(m.id) === state.selected;
      return h("button", {
        class: "item",
        type: "button",
        role: "option",
        "aria-selected": selected ? "true" : "false",
        "data-id": String(m.id),
        onclick: () => { selectMessage(m.id); },
      },
        h("div", { class: "item-top" },
          m.draft_id ? h("span", { class: "unread-dot", title: "Concept wacht op goedkeuring" }) : null,
          h("span", { class: "item-sender", text: displaySender(m.sender) }),
          h("span", { text: formatTime(m.received_at) }),
        ),
        h("div", { class: "item-subject", text: m.subject || "(geen onderwerp)" }),
        h("div", { class: "item-summary", text: m.summary || "" }),
        h("div", { class: "chip-row" },
          intentChip(m.intent),
          channelChip(m.channel),
          m.status === WAITING_FOR_CUSTOMER ? h("span", { class: "chip afspraak", text: "Wacht op klant" })
            : m.draft_id ? h("span", { class: "chip wacht", text: "Concept klaar" }) : null,
        ),
      );
    }));
    placeSetupCard();
  }

  /* ---------- begin-kaart ---------- */

  function setupStatus(data) {
    const v = data.values || {};
    return [
      { id: "ai", num: 1, label: "API-sleutel invullen", done: Boolean((data.secrets_set || {}).ANTHROPIC_API_KEY) },
      { id: "prijs", num: 2, label: "Prijslijst koppelen", done: String(v.WERKER_PRICES_CSV_URL || "").trim() !== "" },
      { id: "mailbox", num: 3, label: "Mailbox toevoegen", done: (data.mailboxes || []).length > 0 },
    ];
  }

  function setupHiddenInBrowser() {
    try { return localStorage.getItem(SETUP_KEY) === "1"; } catch (_) { return false; }
  }

  function openSetupStep(id) {
    state.settingsFocus = SETUP_SECTIONS[id] || null;
    if (location.hash === "#instellingen") onRoute();
    else location.hash = "instellingen";
  }

  function hideSetup() {
    state.setupDismissed = true;
    try { localStorage.setItem(SETUP_KEY, "1"); } catch (_) { /* geen opslag: alleen voor deze sessie */ }
    placeSetupCard();
  }

  function setupCardNode() {
    if (!state.setup || state.setupDismissed || setupHiddenInBrowser()) return null;
    const open = state.setup.filter((step) => !step.done);
    if (!open.length) return null;
    return h("section", { class: "setup-card", "aria-labelledby": "setup-title" },
      h("h3", { id: "setup-title", text: "Begin hier" }),
      h("p", { text: "Drie stappen, dan kan Werker voor je aan de slag." }),
      h("ol", { class: "setup-steps" }, open.map((step) => h("li", {},
        h("button", { class: "setup-step", type: "button", onclick: () => openSetupStep(step.id) },
          h("span", { class: "setup-num", text: String(step.num) }),
          h("span", { text: step.label }),
          svgIcon("arrow"),
        ),
      ))),
      h("div", { class: "actions" },
        h("button", { class: "btn small ghost", type: "button", text: "Later", onclick: hideSetup })),
    );
  }

  // Zet de begin-kaart bovenaan de berichtenlijst; verdwijnt zodra alles ingesteld is.
  function placeSetupCard() {
    if (state.listMode !== "messages") return;
    const items = $("#items");
    items.querySelector(".setup-card")?.remove();
    const card = setupCardNode();
    if (card) items.prepend(card);
  }

  function focusSettingsSection() {
    const target = state.settingsFocus && document.getElementById(state.settingsFocus);
    state.settingsFocus = null;
    if (!target) return;
    const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    target.scrollIntoView({ block: "start", behavior: reduce ? "auto" : "smooth" });
    target.querySelector("input, select, textarea")?.focus({ preventScroll: true });
  }

  /* ---------- klantenlijst ---------- */

  async function loadClients() {
    const loadId = ++state.loadId;
    const params = new URLSearchParams();
    if (state.query) params.set("q", state.query);
    $("#list-title").textContent = "Klanten";
    try {
      const clients = await api(`/api/clients?${params}`);
      if (loadId !== state.loadId) return;
      state.clients = clients;
      renderClientList();
    } catch (error) {
      if (loadId !== state.loadId) return;
      $("#list-sub").textContent = `Kon de klanten niet laden: ${error.message}`;
    }
  }

  function renderClientList() {
    const n = state.clients.length;
    $("#list-sub").textContent = n === 0
      ? (state.query ? "Geen resultaten" : "Nog geen klanten")
      : `${n} ${n === 1 ? "klant" : "klanten"}`;
    if (n === 0) {
      $("#items").replaceChildren(h("div", {
        class: "loading",
        text: state.query ? "Geen klanten gevonden." : "Er zijn nog geen klanten.",
      }));
      return;
    }
    $("#items").replaceChildren(...state.clients.map((c) => {
      const selected = String(c.id) === state.selectedClient;
      const count = c.message_count || 0;
      return h("button", {
        class: "item",
        type: "button",
        role: "option",
        "aria-selected": selected ? "true" : "false",
        "data-client": String(c.id),
        onclick: () => { location.hash = `klant/${encodeURIComponent(c.id)}`; },
      },
        h("div", { class: "item-top" },
          h("span", { class: "item-sender", text: c.name || "(naamloos)" }),
          h("span", { text: formatTime(c.last_received) }),
        ),
        h("div", { class: "item-subject", text: `${count} ${count === 1 ? "bericht" : "berichten"}` }),
        h("div", { class: "chip-row" }, (c.channels || []).map((ch) => channelChip(ch))),
      );
    }));
  }

  /* ---------- bericht in het leesvenster ---------- */

  async function selectMessage(id) {
    const key = String(id);
    state.selected = key;
    state.reader = "message";
    state.selectedClient = null;
    highlightItems();
    setReader(loadingNode("Bericht openen…"));
    try {
      const [message, attachments] = await Promise.all([
        api(`/api/messages/${encodeURIComponent(key)}`),
        api(`/api/messages/${encodeURIComponent(key)}/attachments`).catch(() => []),
      ]);
      if (state.selected !== key || state.reader !== "message") return;
      renderMessage(message, Array.isArray(attachments) ? attachments : []);
      if (window.matchMedia("(max-width: 860px)").matches) {
        document.querySelector(`.item[data-id="${CSS.escape(key)}"]`)?.scrollIntoView({ block: "nearest" });
      }
    } catch (error) {
      if (state.selected !== key) return;
      setReader(errorNode("Kon het bericht niet openen", error.message));
    }
  }

  function renderMessage(m, attachments = []) {
    const name = displaySender(m.sender);
    const address = (m.sender.match(/<([^>]+)>/) || [])[1] || (m.sender.includes("@") ? m.sender : "");
    const nameNode = m.client_id
      ? h("a", { class: "link", href: `#klant/${encodeURIComponent(m.client_id)}`, title: "Open klantgegevens", text: name })
      : h("span", { class: "name", text: name });

    const header = h("div", { class: "card" },
      h("div", { class: "from" },
        h("div", { class: "avatar", "aria-hidden": "true", text: initials(name) }),
        h("div", {},
          h("div", {}, nameNode),
          h("div", { class: "meta" },
            address ? h("span", { text: address }) : null,
            h("span", { text: formatFull(m.received_at) }),
            channelChip(m.channel),
          ),
        ),
      ),
      h("h1", { text: m.subject || "(geen onderwerp)" }),
      h("div", { class: "meta" },
        intentEditor(m),
        urgencyChip(m.urgency),
        h("span", { text: `Status: ${m.status}` }),
      ),
    );

    const waiting = m.status === WAITING_FOR_CUSTOMER
      ? h("div", { class: "notice info", role: "note" }, svgIcon("chat"),
          h("div", { text: "Alleen het WhatsApp-sjabloon is verstuurd; je antwoord blijft klaarstaan tot de klant reageert." }))
      : null;

    const summary = m.summary ? h("div", { class: "card" },
      h("h3", { text: "Samenvatting" }),
      h("p", { class: "summary-text", text: m.summary }),
    ) : null;

    const bodyCard = h("div", { class: "card" },
      h("h3", { text: "Bericht" }),
      h("p", { class: "body", text: m.body || "(leeg bericht)" }),
    );

    const activity = renderActivity(m);

    setReader(h("div", { class: "reader-inner" },
      header, waiting, summary, bodyCard, renderAttachments(attachments), renderDraftCard(m), activity));
  }

  /* Categorie aanpassen, eventueel onthouden voor deze afzender. */
  function intentEditor(m) {
    const selectId = uid("intent");
    const current = INTENT_LABELS[m.intent] ? m.intent : "";
    const select = h("select", { id: selectId, class: `intent-select ${current}` },
      current ? null : h("option", { value: "", text: "Onbekend", selected: true, disabled: true }),
      Object.entries(INTENT_LABELS).map(([value, label]) => h("option", { value, text: label, selected: value === current })),
    );
    const remember = h("input", { type: "checkbox" });
    const save = h("button", { class: "btn small primary", type: "button", text: "Categorie opslaan", hidden: true });
    const update = () => {
      select.className = `intent-select ${select.value}`;
      save.hidden = !select.value || (select.value === current && !remember.checked);
    };
    select.addEventListener("change", update);
    remember.addEventListener("change", update);
    save.addEventListener("click", () => correctIntent(m, select.value, remember.checked, save));
    return h("span", { class: "intent-edit" },
      h("label", { for: selectId, class: "sr-only", text: "Categorie" }),
      select,
      h("label", { class: "check-label small" }, remember, h("span", { text: "Onthoud voor deze afzender" })),
      save,
    );
  }

  async function correctIntent(m, intent, remember, button) {
    button.disabled = true;
    try {
      const result = await api(`/api/messages/${encodeURIComponent(m.id)}/intent`, {
        method: "PATCH",
        body: JSON.stringify({ intent, remember }),
      });
      const label = INTENT_LABELS[result.intent] || result.intent;
      toast(result.rule_id ? `Categorie is nu ${label}, en onthouden voor deze afzender` : `Categorie is nu ${label}`);
    } catch (error) {
      toast(error.message, true);
      button.disabled = false;
      // Bij een ontbrekend afzenderadres is de categorie wel aangepast; ververs dan toch.
      if (error.status !== 422 || !remember) return;
    }
    await refresh();
  }

  /* ---------- bijlagen ---------- */

  function formatSize(bytes) {
    const n = Number(bytes) || 0;
    if (n < 1024 * 1024) return `${Math.max(1, Math.round(n / 1024)).toLocaleString("nl-NL")} KB`;
    return `${(n / (1024 * 1024)).toLocaleString("nl-NL", { maximumFractionDigits: 1 })} MB`;
  }

  function attachmentUrl(a) {
    // Alleen de eigen downloadroute, nooit een adres uit het bericht zelf.
    return a.too_large ? null : `/api/attachments/${encodeURIComponent(a.id)}`;
  }

  function renderAttachments(list) {
    if (!list.length) return null;
    return h("div", { class: "card" },
      h("h3", { text: `Bijlagen (${list.length})` }),
      h("ul", { class: "att-list" }, list.map((a) => {
        const url = attachmentUrl(a);
        const type = String(a.content_type || "").split(";")[0].trim().toLowerCase();
        const preview = url && PREVIEW_IMAGE_TYPES.has(type)
          ? h("img", { class: "att-thumb", src: url, alt: "", loading: "lazy" })
          : h("span", { class: "att-icon" }, svgIcon(type.startsWith("image/") ? "image" : "file"));
        const name = a.filename || "bijlage";
        return h("li", { class: "att-item" },
          preview,
          h("div", { class: "att-info" },
            h("div", { class: "att-name", title: name, text: name }),
            h("div", { class: "att-meta" },
              h("span", { text: formatSize(a.size) }),
              a.too_large ? h("span", { class: "chip klacht", text: "te groot" }) : null,
              a.too_large ? h("span", { text: "Niet bewaard" }) : null,
            ),
          ),
          url ? h("a", { class: "btn small icon-btn", href: url, download: name, "aria-label": `${name} downloaden` },
            svgIcon("download"), h("span", { class: "hide-small", text: "Downloaden" })) : null,
        );
      })),
    );
  }

  function renderDraftCard(m) {
    const pending = m.drafts.find((d) => d.status === "wacht op goedkeuring");
    const scheduled = m.drafts.find((d) => d.status === "ingepland");
    const sent = m.drafts.find((d) => d.status === "verzonden");
    if (pending) return renderPendingDraft(pending);
    if (scheduled) return renderScheduledDraft(scheduled);
    if (sent) {
      return h("div", { class: "card" },
        h("h3", { text: "Antwoord" }),
        h("p", { class: "sent-note", text: "✓ Verzonden" }),
        h("p", { class: "body mt", text: sent.body }),
      );
    }
    return h("div", { class: "card" },
      h("h3", { text: "Antwoord" }),
      h("p", { class: "hint flush", text: "Voor dit bericht is geen antwoord nodig." }),
    );
  }

  function renderChangeNotice(draft) {
    const hasPrevious = Boolean(draft.previous_body);
    const previous = hasPrevious
      ? h("p", { class: "prev-body", hidden: true, text: draft.previous_body })
      : null;
    const toggle = hasPrevious ? h("button", {
      class: "btn small",
      type: "button",
      "aria-expanded": "false",
      text: "Vorige versie tonen",
      onclick: () => {
        const show = previous.hidden;
        previous.hidden = !show;
        toggle.textContent = show ? "Vorige versie verbergen" : "Vorige versie tonen";
        toggle.setAttribute("aria-expanded", String(show));
      },
    }) : null;
    return h("div", {},
      h("div", { class: "notice info" },
        h("div", {},
          h("div", { text: `Bijgewerkt op basis van het nieuwe bericht: ${draft.change_summary}` }),
          toggle,
        ),
      ),
      previous,
    );
  }

  function renderWarnings(draft) {
    if (!draft.errors.length && !draft.reason) return null;
    const items = draft.errors.length ? draft.errors : [draft.reason];
    return h("div", { class: draft.errors.length ? "notice warn" : "notice info" },
      h("div", {},
        h("strong", { text: draft.errors.length ? "Let op: prijscontrole" : "Toelichting van het model" }),
        h("ul", {}, items.map((e) => h("li", { text: e }))),
      ),
    );
  }

  function renderPendingDraft(draft) {
    const textarea = h("textarea", { "aria-label": "Tekst van het antwoord" });
    textarea.value = draft.body;

    const select = h("select", { class: "input pill", "aria-label": "Verzendmoment" },
      h("option", { value: "now", text: "Nu verzenden" }),
      h("option", { value: "hour", text: "Over 1 uur" }),
      h("option", { value: "tomorrow", text: "Morgen om 09:00" }),
      h("option", { value: "custom", text: "Op een tijdstip…" }),
    );
    const custom = h("input", {
      class: "input pill",
      type: "datetime-local",
      "aria-label": "Tijdstip voor verzenden",
      min: localInputValue(new Date()),
      hidden: true,
    });
    const approve = h("button", { class: "btn primary", type: "button", text: "Goedkeuren en verzenden" });
    const reject = h("button", { class: "btn danger", type: "button", text: "Afwijzen" });
    const reset = h("button", { class: "btn ghost", type: "button", text: "Herstel concept" });
    const snippetPop = h("div", { class: "snippet-pop", id: uid("snippets"), hidden: true });
    const snippetButton = h("button", {
      class: "btn icon-btn", type: "button", "aria-expanded": "false", "aria-controls": snippetPop.id,
    }, svgIcon("snippet"), h("span", { text: "Antwoordblok invoegen" }));
    snippetButton.addEventListener("click", () => toggleSnippets(snippetPop, snippetButton, textarea));
    snippetPop.addEventListener("keydown", (event) => {
      if (event.key === "Escape") { closeSnippets(snippetPop, snippetButton); snippetButton.focus(); }
    });

    const ui = { textarea, select, custom, approve };
    approve.addEventListener("click", () => approveDraft(draft, ui, false));
    reject.addEventListener("click", () => rejectDraft(draft.id, reject));
    reset.addEventListener("click", () => { textarea.value = draft.body; });
    select.addEventListener("change", () => {
      approve.textContent = select.value === "now" ? "Goedkeuren en verzenden" : "Inplannen";
      custom.hidden = select.value !== "custom";
      if (!custom.hidden) custom.focus();
    });

    return h("div", { class: "card draft" },
      h("h3", { text: "Concept-antwoord" }),
      draft.change_summary ? renderChangeNotice(draft) : null,
      renderWarnings(draft),
      textarea,
      snippetPop,

  /* ---------- antwoordblokken invoegen ---------- */

  function closeSnippets(pop, button) {
    pop.hidden = true;
    button.setAttribute("aria-expanded", "false");
  }

  function insertAtCursor(textarea, text) {
    const start = textarea.selectionStart ?? textarea.value.length;
    const end = textarea.selectionEnd ?? start;
    textarea.focus();
    textarea.setRangeText(text, start, end, "end");
    textarea.dispatchEvent(new Event("input", { bubbles: true }));
  }

  async function toggleSnippets(pop, button, textarea) {
    if (!pop.hidden) { closeSnippets(pop, button); return; }
    pop.hidden = false;
    button.setAttribute("aria-expanded", "true");
    pop.replaceChildren(h("p", { class: "hint", text: "Antwoordblokken laden…" }));
    let snippets;
    try {
      snippets = await api("/api/snippets");
    } catch (error) {
      pop.replaceChildren(h("p", { class: "hint", text: `Kon de antwoordblokken niet laden: ${error.message}` }));
      return;
    }
    if (pop.hidden) return;
    if (!snippets.length) {
      pop.replaceChildren(h("p", { class: "hint" },
        "Nog geen antwoordblokken. Maak ze aan bij ",
        h("a", { class: "link", href: "#instellingen", onclick: () => { state.settingsFocus = SECTION_IDS.Antwoordblokken; } , text: "Instellingen" }),
        "."));
      return;
    }
    pop.replaceChildren(...snippets.map((snippet) => h("button", {
      class: "snippet-option",
      type: "button",
      onclick: () => {
        closeSnippets(pop, button);
        insertAtCursor(textarea, snippet.body);
        toast(`Antwoordblok „${snippet.title}” ingevoegd`);
      },
    }, h("strong", { text: snippet.title }), h("span", { text: snippet.body }))));
    pop.querySelector(".snippet-option")?.focus();
  }

  /* ---------- verzenden ongedaan maken ---------- */

  const undo = { timer: null, bar: null };

  function hideUndo() {
    clearInterval(undo.timer);
    clearTimeout(undo.timer);
    undo.timer = null;
    undo.bar?.remove();
    undo.bar = null;
    document.body.classList.remove("has-undo");
  }

  function showUndo(result) {
    hideUndo();
    // Klokverschil met de server afvangen: nooit langer dan de grootste bedenktijd (300 s).
    const left = Math.max(0, Math.min(Date.parse(result.undo_until) - Date.now(), 300000));
    const deadline = Date.now() + (Number.isFinite(left) ? left : 0);
    const count = h("span", { class: "undo-count", "aria-live": "off" });
    const button = h("button", { class: "btn small", type: "button", text: "Ongedaan maken" });
    const bar = h("div", { class: "undo-bar", role: "region", "aria-label": "Verzenden ongedaan maken" },
      h("span", { class: "sr-only", role: "status", text: "Antwoord goedgekeurd. Je kunt het verzenden nog ongedaan maken." }),
      count, button);
    button.addEventListener("click", () => undoSend(result.draft_id, button));
    const tick = () => {
      const seconds = Math.ceil((deadline - Date.now()) / 1000);
      if (seconds > 0) { count.textContent = `Verzonden over ${seconds} s`; return; }
      clearInterval(undo.timer);
      count.textContent = "Wordt verzonden…";
      button.disabled = true;
      // De achtergrondtaak verstuurt binnen enkele seconden; daarna de weergave bijwerken.
      undo.timer = setTimeout(() => { hideUndo(); refresh(); }, 6000);
    };
    undo.bar = bar;
    document.body.append(bar);
    document.body.classList.add("has-undo");
    tick();
    if (deadline > Date.now()) undo.timer = setInterval(tick, 250);
    button.focus({ preventScroll: true });
  }

  async function undoSend(draftId, button) {
    button.disabled = true;
    try {
      await api(`/api/drafts/${encodeURIComponent(draftId)}/cancel-schedule`, { method: "POST" });
      hideUndo();
      toast("Verzenden ongedaan gemaakt. Het concept staat weer klaar.");
    } catch (error) {
      hideUndo();
      toast(`Ongedaan maken lukte niet: ${error.message}`, true);
    }
    await refresh();
  }

  function renderScheduledDraft(draft) {
    const textarea = h("textarea", { readonly: true, "aria-label": "Ingepland antwoord" });
    textarea.value = draft.body;
    const when = draft.scheduled_for ? formatFull(draft.scheduled_for) : "onbekend tijdstip";
    const cancel = h("button", { class: "btn", type: "button", text: "Planning annuleren" });
    const reject = h("button", { class: "btn danger", type: "button", text: "Afwijzen" });
    cancel.addEventListener("click", () => cancelSchedule(draft.id, cancel));
    reject.addEventListener("click", () => rejectDraft(draft.id, reject));
    return h("div", { class: "card draft" },
      h("h3", { text: "Concept-antwoord" }),
      h("div", { class: "notice info" }, h("div", { text: `Ingepland voor ${when}` })),
      textarea,
      h("div", { class: "actions" }, h("span", { class: "spacer" }), cancel, reject),
    );
  }

  function sendAtFor(choice, customValue) {
    const now = new Date();
    if (choice === "now") return null;
    if (choice === "hour") return new Date(now.getTime() + 60 * 60 * 1000).toISOString();
    if (choice === "tomorrow") {
      const d = new Date(now);
      d.setDate(d.getDate() + 1);
      d.setHours(9, 0, 0, 0);
      return d.toISOString();
    }
    const when = new Date(customValue);
    if (!customValue || Number.isNaN(when.getTime())) {
      toast("Kies een geldig tijdstip.", true);
      return undefined;
    }
    if (when <= now) {
      toast("Kies een tijdstip in de toekomst.", true);
      return undefined;
    }
    return when.toISOString();
  }

  async function approveDraft(draft, ui, force) {
    const body = ui.textarea.value.trim();
    if (!body) { toast("Het antwoord is leeg.", true); return; }
    const sendAt = sendAtFor(ui.select.value, ui.custom.value);
    if (sendAt === undefined) return;
    const payload = { body };
    if (sendAt !== null) payload.send_at = sendAt;
    if (force) payload.force = true;

    ui.approve.disabled = true;
    try {
      const result = await api(`/api/drafts/${draft.id}/approve`, { method: "POST", body: JSON.stringify(payload) });
      if (result && result.undo_until) showUndo(result);
      else toast(result && result.status === "ingepland" ? "Antwoord ingepland" : "Antwoord verzonden");
    } catch (error) {
      if (error.status === 409 && !force) {
        if (confirm(`${error.message}\n\nToch verzenden?`)) return approveDraft(draft, ui, true);
        toast("Verzenden geannuleerd.");
      } else {
        toast(error.message, true);
      }
      ui.approve.disabled = false;
      return;
    }
    await refresh();
  }

  async function rejectDraft(draftId, button) {
    if (!confirm("Dit concept afwijzen? Er wordt niets verzonden.")) return;
    button.disabled = true;
    try {
      await api(`/api/drafts/${draftId}/reject`, { method: "POST" });
      toast("Concept afgewezen");
      await refresh();
    } catch (error) {
      toast(error.message, true);
      button.disabled = false;
    }
  }

  async function cancelSchedule(draftId, button) {
    button.disabled = true;
    try {
      await api(`/api/drafts/${draftId}/cancel-schedule`, { method: "POST" });
      toast("Planning geannuleerd");
      await refresh();

    try {

  function renderClient(client, all) {
    const id = String(client.id);
    let savedName = client.name || "";
    let savedNotes = client.notes || "";

    const title = h("h1", { text: savedName || "(naamloos)" });

    const nameId = uid("cname");
    const nameInput = h("input", { id: nameId, class: "input", type: "text", value: savedName, autocomplete: "off" });
    const saveName = async () => {
      const value = nameInput.value.trim();
      if (!value) {
        nameInput.value = savedName;
        toast("De naam mag niet leeg zijn.", true);
        return;
      }
      if (value === savedName) return;
      if (await patchClient(id, { name: value }, "Naam opgeslagen")) {
        savedName = value;
        nameInput.value = value;
        title.textContent = value;
        loadClients();
      }
    };
    nameInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter") { event.preventDefault(); saveName(); }
    });

    const notesId = uid("cnotes");
    const notesInput = h("textarea", { id: notesId, class: "input", });
    notesInput.value = savedNotes;
    const saveNotes = async () => {
      const value = notesInput.value;
      if (value === savedNotes) { toast("Geen wijzigingen om op te slaan."); return; }
      if (await patchClient(id, { notes: value }, "Notities opgeslagen")) {
        savedNotes = value;
      }
    };

    const identifiers = client.identifiers || [];
    const identCard = h("div", { class: "card" },
      h("h3", { text: "Identificatoren" }),
      identifiers.length
        ? h("ul", { class: "ident-list" }, identifiers.map((i) => h("li", { text: `${identLabel(i.kind)}: ${i.value}` })))
        : h("p", { class: "hint flush", text: "Nog geen identificatoren bekend." }),
    );

    const others = all.filter((c) => String(c.id) !== id);
    const mergeId = uid("merge");
    const mergeSelect = h("select", { id: mergeId, class: "input" },
      h("option", { value: "", text: "Kies een klant…" }),
      others.map((c) => h("option", { value: String(c.id), text: `${c.name || "(naamloos)"} (${c.message_count || 0})` })),
    );
    const mergeButton = h("button", { class: "btn", type: "button", text: "Samenvoegen" });
    mergeButton.addEventListener("click", async () => {
      const target = others.find((c) => String(c.id) === mergeSelect.value);
      if (!target) { toast("Kies eerst een klant.", true); return; }
      if (!confirm(`Alle berichten van "${savedName}" gaan naar "${target.name}". Dit kun je niet ongedaan maken.\n\nDoorgaan?`)) return;
      mergeButton.disabled = true;
      try {
        await api(`/api/clients/${encodeURIComponent(id)}/merge`, { method: "POST", body: JSON.stringify({ into: target.id }) });
        toast("Klanten samengevoegd");
        location.hash = `klant/${encodeURIComponent(target.id)}`;
      } catch (error) {
        toast(error.message, true);
        mergeButton.disabled = false;
      }
    });

    const messages = [...(client.messages || [])]
      .sort((a, b) => new Date(b.received_at) - new Date(a.received_at));
    const timeline = messages.length
      ? messages.map((msg) => h("button", {
          class: "tl-item",
          type: "button",
          onclick: () => { location.hash = `bericht/${encodeURIComponent(msg.id)}`; },
        },
          h("div", { class: "item-top" },
            channelChip(msg.channel),
            h("span", { text: formatTime(msg.received_at) }),
          ),
          h("div", { class: "item-subject", text: msg.subject || msg.summary || "(geen onderwerp)" }),
          h("div", { class: "chip-row" },
            intentChip(msg.intent),
            h("span", { class: "tl-status", text: msg.status || "" }),
          ),
        ))
      : [h("p", { class: "hint flush", text: "Nog geen berichten van deze klant." })];

    const exportButton = h("button", { class: "btn", type: "button", text: "Exporteren" });
    exportButton.addEventListener("click", () => exportClient(id, exportButton));
    const eraseButton = h("button", { class: "btn danger", type: "button", text: "Verwijderen" });
    eraseButton.addEventListener("click", () => openEraseDialog(id, savedName));

    setReader(h("div", { class: "reader-inner" },
      h("a", { class: "link back", href: "#klanten", text: "← Alle klanten" }),
      title,
      h("div", { class: "card" },
        h("h3", { text: "Gegevens" }),
        h("div", { class: "field" },
          h("label", { for: nameId, text: "Naam" }),
          h("div", { class: "row-inline" }, nameInput, h("button", { class: "btn", type: "button", text: "Opslaan", onclick: saveName })),
        ),
        h("div", { class: "field" },
          h("label", { for: notesId, text: "Notities" }),
          notesInput,
          h("div", { class: "actions" },
            h("span", { class: "hint flush", text: `${messages.length} ${messages.length === 1 ? "bericht" : "berichten"}` }),
            h("span", { class: "spacer" }),
            h("button", { class: "btn", type: "button", text: "Notities opslaan", onclick: saveNotes }),
          ),
        ),
      ),
      identCard,
      h("div", { class: "card" },
        h("h3", { text: "Samenvoegen" }),
        h("p", { class: "hint flush", text: "Berichten en gegevens van deze klant gaan naar de gekozen klant." }),
        h("div", { class: "row-inline mt" },
          h("label", { for: mergeId, class: "sr-only", text: "Samenvoegen met" }),
          mergeSelect, mergeButton,

      h("div", { class: "card" },
        h("h3", { text: "Gegevens van de klant" }),

        h("div", { class: "actions" }, exportButton, eraseButton),
      ),
      h("div", { class: "card" },
        h("h3", { text: "Berichten" }),
        timeline,
      ),
    ));
    highlightItems();
  }

  /* ---------- ondertekening per kanaal ---------- */

  function parseSignatures(raw) {
    try {
      const data = typeof raw === "string" ? JSON.parse(raw || "{}") : raw;
      return data && typeof data === "object" && !Array.isArray(data) ? data : {};
    } catch (_) {
      return {};
    }
  }

  function signatureChannels(data, stored) {
    const values = data.values || {};
    const list = (data.mailboxes || []).filter((mb) => mb.name).map((mb) => [`mail:${mb.name}`, `Mailbox ${mb.name}`]);
    list.push(["mail:gmail", "Gmail"]);
    if (String(values.WERKER_OUTLOOK_CLIENT_ID || "").trim() || stored["mail:outlook"]) list.push(["mail:outlook", "Outlook"]);
    list.push(["whatsapp", "WhatsApp"], ["imessage", "iMessage"]);
    // Een ondertekening voor een kanaal dat hier niet (meer) staat, blijft zichtbaar zodat ze niet stilletjes verdwijnt.
    for (const key of Object.keys(stored)) {
      if (!list.some(([channel]) => channel === key)) list.push([key, channelLabel(key)]);
    }
    return list;
  }

  function signatureFields(data) {
    const stored = parseSignatures((data.values || {}).WERKER_SIGNATURES);
    return h("div", { id: "signatures" }, signatureChannels(data, stored).map(([channel, label]) => {
      const id = uid("sig");
      const area = h("textarea", {
        id, class: "input", rows: "3", maxlength: String(SIGNATURE_MAX), "data-sig-channel": channel,
        placeholder: "Geen ondertekening",
      });
      area.value = typeof stored[channel] === "string" ? stored[channel] : "";
      return field(id, label, area);
    }), h("div", { class: "hint flush", text: "Wordt onder elk antwoord gezet. Staat de tekst al onderaan het concept, dan komt hij er niet nog een keer onder." }));
  }

  function readSignatures() {
    const result = {};
    document.querySelectorAll("[data-sig-channel]").forEach((area) => {
      const text = area.value.trim();
      if (text) result[area.dataset.sigChannel] = text;
    });
    return result;
  }

  /* ---------- antwoordblokken beheren ---------- */

  function charCounter(control, max) {
    const counter = h("div", { class: "counter", "aria-live": "off" });
    const update = () => { counter.textContent = `${control.value.length} / ${max}`; };
    control.addEventListener("input", update);
    update();
    return counter;
  }

  function snippetSettings() {
    const list = h("div", { id: "snippet-list" }, loadingNode("Antwoordblokken laden…"));
    const load = async () => {
      try {
        const snippets = await api("/api/snippets");
        list.replaceChildren(...(snippets.length
          ? snippets.map((snippet) => snippetEditor(snippet, load))
          : [h("p", { class: "hint flush", "data-empty": "", text: "Nog geen antwoordblokken." })]));
      } catch (error) {
        list.replaceChildren(h("div", { class: "notice warn" }, h("div", { text: `Kon de antwoordblokken niet laden: ${error.message}` })));
      }
    };
    load();
    const add = h("button", { class: "btn", type: "button" }, svgIcon("plus"), "Antwoordblok toevoegen");
    add.addEventListener("click", () => {
      list.querySelector("[data-empty]")?.remove();
      const editor = snippetEditor({}, load);
      list.prepend(editor);
      editor.querySelector("input")?.focus();
    });
    return h("div", {}, list, h("div", { class: "actions" }, add));
  }

  function snippetEditor(snippet, reload) {
    const isNew = !snippet.id;
    const titleId = uid("snip-title");
    const bodyId = uid("snip-body");
    const legend = h("legend", { text: snippet.title || "Nieuw antwoordblok" });
    const title = h("input", {
      id: titleId, class: "input", type: "text", maxlength: String(SNIPPET_TITLE_MAX), autocomplete: "off",
      value: snippet.title || "", placeholder: "bijvoorbeeld Openingstijden",
    });
    const body = h("textarea", { id: bodyId, class: "input", rows: "4", maxlength: String(SNIPPET_BODY_MAX) });
    body.value = snippet.body || "";
    // Enter in de titel mag niet het hele instellingenformulier opslaan.
    title.addEventListener("keydown", (event) => { if (event.key === "Enter") event.preventDefault(); });
    title.addEventListener("input", () => { legend.textContent = title.value.trim() || "Nieuw antwoordblok"; });
    const save = h("button", { class: "btn small primary", type: "button", text: isNew ? "Toevoegen" : "Opslaan" });
    const remove = h("button", { class: "btn small danger", type: "button", text: isNew ? "Annuleren" : "Verwijderen" });
    const card = h("fieldset", { class: "sub-card", "data-snippet": isNew ? "new" : String(snippet.id) },
      legend,
      field(titleId, "Titel", title),
      field(bodyId, "Tekst", body, null),
      charCounter(body, SNIPPET_BODY_MAX),
      h("div", { class: "actions" }, remove, save),
    );
    save.addEventListener("click", async () => {
      const payload = { title: title.value.trim(), body: body.value.trim() };
      if (!payload.title || !payload.body) { toast("Vul een titel en een tekst in.", true); return; }
      save.disabled = true;
      try {
        await api(isNew ? "/api/snippets" : `/api/snippets/${encodeURIComponent(snippet.id)}`, {
          method: isNew ? "POST" : "PUT",
          body: JSON.stringify(payload),
        });
        toast(isNew ? "Antwoordblok toegevoegd" : "Antwoordblok opgeslagen");
        await reload();
      } catch (error) {
        toast(error.message, true);
        save.disabled = false;
      }
    });
    remove.addEventListener("click", async () => {
      if (isNew) { card.remove(); return; }
      if (!confirm(`Antwoordblok „${snippet.title}” verwijderen?`)) return;
      remove.disabled = true;
      try {
        await api(`/api/snippets/${encodeURIComponent(snippet.id)}`, { method: "DELETE" });
        toast("Antwoordblok verwijderd");
        await reload();
      } catch (error) {
        toast(error.message, true);
        remove.disabled = false;
      }
    });
    return card;
  }
