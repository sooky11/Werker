<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Werker · Inbox</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#b4532a">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
  :root {
    --bg: #f6f4f0;
    --surface: #ffffff;
    --surface-2: #faf8f5;
    --border: #e6e1d8;
    --text: #1f1c18;
    --muted: #6f6a60;
    --accent: #b4532a;
    --accent-soft: #f7e6dd;
    --ok: #2f7d4f;
    --ok-soft: #e1f2e8;
    --warn: #a86a00;
    --warn-soft: #fbefd6;
    --danger: #b3261e;
    --danger-soft: #f9dedc;
    --radius: 12px;
    --shadow: 0 1px 2px rgba(31, 28, 24, .06), 0 4px 16px rgba(31, 28, 24, .04);
    --font: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14120f;
      --surface: #1c1915;
      --surface-2: #221e19;
      --border: #332d26;
      --text: #f2ede6;
      --muted: #a39b8f;
      --accent: #e8805a;
      --accent-soft: #3a261d;
      --ok: #6cc08b;
      --ok-soft: #1d3327;
      --warn: #e6b04f;
      --warn-soft: #3a2f16;
      --danger: #f2877f;
      --danger-soft: #3d1f1d;
      --shadow: 0 1px 2px rgba(0, 0, 0, .4);
    }
  }
  :root[data-theme="dark"] {
    --bg: #14120f; --surface: #1c1915; --surface-2: #221e19; --border: #332d26;
    --text: #f2ede6; --muted: #a39b8f; --accent: #e8805a; --accent-soft: #3a261d;
    --ok: #6cc08b; --ok-soft: #1d3327; --warn: #e6b04f; --warn-soft: #3a2f16;
    --danger: #f2877f; --danger-soft: #3d1f1d; --shadow: 0 1px 2px rgba(0, 0, 0, .4);
  }

  /* Drie weergavethema's; de kleuren en vormen staan hier, de indeling blijft gelijk. */
  :root[data-theme="editorieel"] {
    --bg: #f7f4ee; --surface: #fbf9f4; --surface-2: #f1ece2; --border: #e4ded3;
    --text: #1d1b18; --muted: #8a8378; --accent: #9b7b3c; --accent-soft: #efe6d2;
    --ok: #4f7a4a; --ok-soft: #e6efe2; --warn: #9b7b3c; --warn-soft: #f3ead6;
    --danger: #a13d32; --danger-soft: #f6e1dd; --radius: 4px; --shadow: none;
    --font: Georgia, "Times New Roman", serif;
  }
  :root[data-theme="donker"] {
    --bg: #0b0d10; --surface: #14171c; --surface-2: #1a1f26; --border: #23272f;
    --text: #f2f4f7; --muted: #7d8594; --accent: #4fd1c5; --accent-soft: #17303a;
    --ok: #4fd1c5; --ok-soft: #17303a; --warn: #f5b84b; --warn-soft: #3a2c12;
    --danger: #f2877f; --danger-soft: #3d1f1d; --radius: 14px; --shadow: 0 1px 2px rgba(0, 0, 0, .4);
    --font: -apple-system, "Segoe UI", Inter, Roboto, sans-serif;
  }
  :root[data-theme="zacht"] {
    --bg: #eef0f7; --surface: #ffffff; --surface-2: #f6f7fc; --border: #e3e5f2;
    --text: #1b1d2a; --muted: #7a7f96; --accent: #6d5efc; --accent-soft: #ecebff;
    --ok: #1f9d6b; --ok-soft: #e3f6ee; --warn: #b26a00; --warn-soft: #fdf1dc;
    --danger: #d9415b; --danger-soft: #fde4e9; --radius: 18px; --shadow: 0 10px 30px rgba(40, 44, 90, .07);
    --font: Inter, -apple-system, "Segoe UI", Roboto, sans-serif;
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.5 var(--font); -webkit-font-smoothing: antialiased;
  }
  button, input, textarea, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .sr-only {
    position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap;
  }

  /* Topbar */
  header {
    position: sticky; top: 0; z-index: 10; height: 60px;
    display: flex; align-items: center; gap: 12px; padding: 0 20px;
    background: var(--surface); border-bottom: 1px solid var(--border);
  }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 650; letter-spacing: -.01em; }
  .brand-mark {
    width: 28px; height: 28px; border-radius: 8px; background: var(--accent);
    display: grid; place-items: center; color: #fff; font-size: 14px; font-weight: 700;
  }
  .search { flex: 1; max-width: 460px; margin-left: auto; position: relative; min-width: 0; }
  .search input {
    width: 100%; height: 36px; padding: 0 12px 0 34px; border-radius: 999px;
    border: 1px solid var(--border); background: var(--surface-2); outline: none;
  }
  .search input:focus { border-color: var(--accent); }
  .search::before {
    content: ""; position: absolute; left: 13px; top: 11px; width: 12px; height: 12px;
    border: 2px solid var(--muted); border-radius: 50%;
  }
  .btn {
    height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--border);
    background: var(--surface); font-weight: 550; white-space: nowrap;
    transition: background .15s, border-color .15s;
  }
  .btn:hover { background: var(--surface-2); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.primary:hover { filter: brightness(1.06); background: var(--accent); }
  .btn.ghost { border-color: transparent; background: transparent; color: var(--muted); }
  .btn.danger { color: var(--danger); }
  .btn.small { height: 30px; padding: 0 10px; font-size: 13px; }
  .btn:disabled { opacity: .5; cursor: default; }
  .btn.icon-btn { display: inline-flex; align-items: center; gap: 6px; }
  .btn[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }

  /* Layout */
  .layout {
    display: grid; grid-template-columns: 220px minmax(300px, 380px) minmax(0, 1fr);
    height: calc(100vh - 60px);
  }
  nav {
    border-right: 1px solid var(--border); padding: 16px 12px; overflow-y: auto;
    background: var(--surface);
  }
  .nav-title {
    font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted);
    margin: 14px 10px 6px;
  }
  .nav-title:first-child { margin-top: 8px; }
  .nav-item {
    width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: 8px 10px; border: 0; border-radius: 8px; background: transparent; text-align: left;
  }
  .nav-item:hover { background: var(--surface-2); }
  .nav-item[aria-current="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .count {
    min-width: 22px; padding: 0 7px; border-radius: 999px; font-size: 12px; text-align: center;
    background: var(--surface-2); color: var(--muted); line-height: 20px;
  }
  .nav-item[aria-current="true"] .count { background: var(--surface); color: var(--accent); }
  .count.hot { background: var(--accent); color: #fff; }

  /* List */
  .list { border-right: 1px solid var(--border); overflow-y: auto; background: var(--bg); }
  .list-head {
    position: sticky; top: 0; padding: 14px 16px 10px; background: var(--bg);
    border-bottom: 1px solid var(--border); z-index: 1;
  }
  .list-head h2 { margin: 0; font-size: 16px; }
  .list-head p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
  .item {
    display: block; width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--border);
    background: transparent; padding: 14px 16px; position: relative;
  }
  .item:hover { background: var(--surface); }
  .item[aria-selected="true"] { background: var(--surface); }
  .item[aria-selected="true"]::before {
    content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--accent);
  }
  .item-top { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
  .item-sender { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text); font-weight: 600; }
  .item-subject { margin-top: 2px; font-weight: 550; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item-summary {
    margin-top: 2px; color: var(--muted); font-size: 13px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .unread-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); flex: none; }
  .chip-row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; align-items: center; }

  /* Chips */
  .chip {
    display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 9px;
    border-radius: 999px; font-size: 12px; font-weight: 600; background: var(--surface-2);
    color: var(--muted); border: 1px solid var(--border); white-space: nowrap;
  }
  .chip::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .chip.prijsvraag { color: var(--ok); background: var(--ok-soft); border-color: transparent; }
  .chip.afspraak { color: #3b6fb6; background: #e3edf9; border-color: transparent; }
  .chip.klacht, .chip.hoog { color: var(--danger); background: var(--danger-soft); border-color: transparent; }
  .chip.factuur { color: var(--warn); background: var(--warn-soft); border-color: transparent; }
  .chip.wacht { color: var(--accent); background: var(--accent-soft); border-color: transparent; }

  /* Reading pane */
  .reader { overflow-y: auto; padding: 28px clamp(16px, 4vw, 48px) 60px; }
  .reader-inner { max-width: 760px; margin: 0 auto; }
  .empty {
    height: 100%; display: grid; place-items: center; text-align: center; color: var(--muted);
  }
  .empty h3 { color: var(--text); margin: 0 0 6px; font-size: 17px; }
  .reader h1 { font-size: 24px; line-height: 1.25; letter-spacing: -.02em; margin: 6px 0 14px; font-weight: 650; overflow-wrap: anywhere; }
  .meta { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; color: var(--muted); font-size: 13.5px; }
  .meta strong { color: var(--text); font-weight: 600; }
  .name { font-weight: 650; }
  .avatar {
    width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center;
    background: var(--accent-soft); color: var(--accent); font-weight: 650; flex: none;
  }
  .from { display: flex; gap: 12px; align-items: center; margin-bottom: 18px; min-width: 0; }
  .from > div:last-child { min-width: 0; }
  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 18px 20px; margin-bottom: 16px;
  }
  .card h3 { margin: 0 0 8px; font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 650; }
  .summary-text { margin: 0; font-size: 15px; }
  .body {
    white-space: pre-wrap; word-wrap: break-word; font-size: 16px; line-height: 1.65;
    max-width: 68ch; margin: 0;
  }
  .body.mt { margin-top: 10px; }
  .draft textarea {
    width: 100%; min-height: 180px; resize: vertical; padding: 14px 16px; border-radius: 10px;
    border: 1px solid var(--border); background: var(--surface-2); line-height: 1.6; outline: none;
  }
  .draft textarea:focus { border-color: var(--accent); }
  .draft textarea[readonly] { color: var(--muted); }
  .notice {
    display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: 10px;
    font-size: 14px; margin-bottom: 12px;
  }
  .notice > div { min-width: 0; }
  .notice.warn { background: var(--warn-soft); color: var(--warn); }
  .notice.info { background: var(--accent-soft); color: var(--accent); }
  .notice ul { margin: 4px 0 0; padding-left: 18px; }
  .notice .btn { margin-top: 8px; }
  .prev-body {
    white-space: pre-wrap; word-wrap: break-word; color: var(--muted); background: var(--surface-2);
    border-left: 3px solid var(--border); border-radius: 8px; padding: 10px 12px; margin: 0 0 12px;
    font-size: 14px; line-height: 1.6;
  }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; align-items: center; margin-top: 12px; }
  .actions .spacer { flex: 1; }
  .sent-note { color: var(--ok); font-weight: 600; margin: 0; }
  .hint { color: var(--muted); font-size: 13px; margin-top: 8px; }
  .hint.flush { margin-top: 0; }
  .link { color: var(--accent); text-decoration: none; font-weight: 650; }
  .link:hover { text-decoration: underline; }
  .back { display: inline-block; font-size: 14px; margin-bottom: 4px; }
  .mt { margin-top: 12px; }
  .seg { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
  .seg-btn {
    height: 30px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--border);
    background: var(--surface); font-size: 13px; font-weight: 550;
  }
  .seg-btn:hover { background: var(--surface-2); }
  .seg-btn[aria-pressed="true"] { background: var(--accent-soft); border-color: transparent; color: var(--accent); font-weight: 650; }
  .kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 8px 18px; margin: 0; }
  .kv dt { color: var(--muted); font-size: 14px; }
  .kv dd { margin: 0; overflow-wrap: anywhere; }
  .path-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 8px 0 0; }
  code.path {
    font: 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; background: var(--surface-2);
    border: 1px solid var(--border); padding: 4px 8px; border-radius: 8px; overflow-wrap: anywhere;
  }
  pre.xml {
    white-space: pre; overflow: auto; max-height: 420px; max-width: 100%; margin: 10px 0 0;
    background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px; padding: 12px;
    font: 12.5px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  .card-subtitle { margin: 14px 0 6px; font-size: 14px; font-weight: 650; }
  kbd {
    font: 12px var(--font); padding: 1px 6px; border-radius: 6px; border: 1px solid var(--border);
    background: var(--surface-2); color: var(--muted);
  }

  /* Activity */
  details.activity summary {
    cursor: pointer; font-size: 13px; text-transform: uppercase; letter-spacing: .06em;
    color: var(--muted); font-weight: 650;
  }
  .log-list { list-style: none; padding: 0; margin: 12px 0 0; font-size: 13px; color: var(--muted); }
  .log-list li { padding: 6px 0; border-bottom: 1px solid var(--border); overflow-wrap: anywhere; }
  .log-list strong { color: var(--text); font-weight: 600; }
  .log-time { margin-right: 10px; font-variant-numeric: tabular-nums; }

  /* Clients */
  .ident-list { list-style: none; padding: 0; margin: 0; display: grid; gap: 6px; }
  .tl-item {
    display: block; width: 100%; text-align: left; background: var(--surface-2);
    border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px;
  }
  .tl-item:hover { border-color: var(--accent); }
  .tl-item .item-top { color: var(--muted); }
  .tl-status { font-size: 12px; color: var(--muted); }
  .row-inline { display: flex; gap: 8px; align-items: center; }
  .row-inline .input { flex: 1; min-width: 0; }

  /* Forms */
  .input {
    width: 100%; padding: 9px 12px; border-radius: 10px; border: 1px solid var(--border);
    background: var(--surface-2); outline: none; line-height: 1.4;
  }
  .input:focus { border-color: var(--accent); }
  .input.pill { width: auto; height: 36px; padding: 0 12px; border-radius: 999px; }
  textarea.input { min-height: 96px; resize: vertical; }
  .field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; min-width: 0; }
  .field > label { font-weight: 600; font-size: 14px; }
  .check-label { display: flex; gap: 10px; align-items: center; font-weight: 600; font-size: 14px; cursor: pointer; }
  .check-label input { width: 18px; height: 18px; accent-color: var(--accent); margin: 0; }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 14px; }
  .settings-section { margin-bottom: 16px; }
  .section-title { margin: 0 0 4px; font-size: 16px; font-weight: 650; }
  .section-intro { margin: 0 0 14px; color: var(--muted); font-size: 14px; }
  .mailbox-card {
    border: 1px solid var(--border); border-radius: 10px; padding: 10px 14px 2px; margin: 0 0 12px;
    background: var(--surface-2); min-width: 0;
  }
  .mailbox-card legend { font-weight: 650; padding: 0 6px; font-size: 14px; }
  .form-footer { display: flex; justify-content: flex-end; margin-top: 8px; }

  /* Toast */
  .toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(20px);
    background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 10px;
    box-shadow: var(--shadow); opacity: 0; pointer-events: none; transition: .25s; max-width: calc(100vw - 32px);
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.error { background: var(--danger); color: #fff; }

  .loading { color: var(--muted); padding: 24px; font-size: 14px; }

  /* Responsive */
  @media (max-width: 1100px) {
    .layout { grid-template-columns: 200px minmax(280px, 340px) minmax(0, 1fr); }
  }
  @media (max-width: 860px) {
    header { padding: 0 12px; gap: 8px; }
    .brand span.word { display: none; }
    .layout { grid-template-columns: 1fr; height: auto; min-height: calc(100vh - 60px); }
    nav {
      display: flex; gap: 6px; overflow-x: auto; padding: 10px 12px; border-right: 0;
      border-bottom: 1px solid var(--border); position: sticky; top: 60px; z-index: 5;
    }
    .nav-title { display: none; }
    #nav, #nav-clients, #nav-peppol { display: contents; }
    .nav-item { width: auto; white-space: nowrap; border: 1px solid var(--border); background: var(--surface); }
    .list { border-right: 0; overflow: visible; }
    .list-head { position: static; }
    .reader { overflow: visible; padding: 20px 16px 60px; border-top: 1px solid var(--border); }
    .reader h1 { font-size: 20px; }
    .search { max-width: none; min-width: 0; }
    .hide-small { display: none; }
    .actions { justify-content: stretch; }
    .actions .spacer { display: none; }
  }
  @media (max-width: 560px) {
    .grid-2 { grid-template-columns: 1fr; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="brand-mark" aria-hidden="true">W</div>
    <span class="word">Werker</span>
  </div>
  <div class="search">
    <label for="q" class="sr-only">Zoeken</label>
    <input id="q" type="search" placeholder="Zoeken" autocomplete="off">
  </div>
  <button class="btn primary" id="sync" type="button">Synchroniseer</button>
  <button class="btn icon-btn" id="settings-btn" type="button" aria-label="Instellingen" aria-pressed="false" title="Instellingen">
    <span aria-hidden="true">⚙</span><span class="hide-small">Instellingen</span>
  </button>
</header>

<div class="layout">
  <nav aria-label="Categorieën">
    <div class="nav-title">Inbox</div>
    <div id="nav"></div>
    <div class="nav-title">Klanten</div>
    <div id="nav-clients"></div>
    <div class="nav-title">Peppol</div>
    <div id="nav-peppol"></div>
  </nav>

  <section class="list" aria-label="Lijst">
    <div class="list-head">
      <h2 id="list-title">Wacht op goedkeuring</h2>
      <p id="list-sub">Laden…</p>
      <div class="seg" id="seg" hidden></div>
    </div>
    <div id="items"></div>
  </section>

  <main class="reader" id="reader" aria-live="polite"></main>
</div>

<div class="toast" id="toast" role="status"></div>

<script>
(() => {
  "use strict";

  const TABS = [
    { id: "pending", label: "Wacht op goedkeuring", params: { pending: 1 } },
    { id: "ingepland", label: "Ingepland", params: { scheduled: 1 } },
    { id: "all", label: "Alles", params: {} },
    { id: "prijsvraag", label: "Prijsvragen", params: { intent: "prijsvraag" } },
    { id: "afspraak", label: "Afspraken", params: { intent: "afspraak" } },
    { id: "klacht", label: "Klachten", params: { intent: "klacht" } },
    { id: "factuur", label: "Facturen", params: { intent: "factuur" } },
    { id: "overig", label: "Overig", params: { intent: "overig" } },
    { id: "betaling", label: "Betalingen", params: { intent: "betaling" } },
    { id: "nieuwsbrief", label: "Nieuwsbrieven", params: { intent: "nieuwsbrief" } },
    { id: "spam", label: "Spam", params: { intent: "spam" } },
  ];
  const INTENT_LABELS = {
    prijsvraag: "Prijsvraag", afspraak: "Afspraak", klacht: "Klacht", factuur: "Factuur",
    betaling: "Betaling", overig: "Overig", nieuwsbrief: "Nieuwsbrief", spam: "Spam",
  };
  const URGENCY_LABELS = { hoog: "Urgent", normaal: "Normaal", laag: "Laag" };
  const CHANNEL_NAMES = { whatsapp: "WhatsApp", imessage: "iMessage", "mail:gmail": "Gmail", mail: "Mail" };
  const IDENT_LABELS = { email: "E-mail", phone: "Telefoon", telefoon: "Telefoon", whatsapp: "WhatsApp", imessage: "iMessage" };
  const SECRET_FIELDS = {
    ANTHROPIC_API_KEY: "s-anthropic",
    WHATSAPP_TOKEN: "s-watoken",
    WHATSAPP_APP_SECRET: "s-waapp",
    WHATSAPP_VERIFY_TOKEN: "s-waverify",
    PEPPOL_API_KEY: "s-pepkey",
  };
  const THEMES = [["editorieel", "Editorieel (crème, serif)"], ["donker", "Donker (modern)"], ["zacht", "Zacht (lichte kaarten)"]];
  function applyTheme(name) {
    document.documentElement.dataset.theme = THEMES.some(([v]) => v === name) ? name : "editorieel";
  }
  const INVOICE_TABS = [
    { slug: "wacht-op-betaling", label: "Wacht op betaling", status: "wacht op betaling" },
    { slug: "te-verzenden", label: "Te verzenden", status: "te verzenden" },
    { slug: "verzonden", label: "Verzonden", status: "verzonden" },
    { slug: "in-map", label: "In map", status: "in map" },
  ];
  const INVOICE_STATUS_CLASS = {
    "wacht op betaling": "wacht", "te verzenden": "factuur", "verzonden": "prijsvraag", "in map": "klacht",
  };
  const PLACEHOLDER_SET = "ingesteld — laat leeg om te houden";
  const PLACEHOLDER_UNSET = "niet ingesteld";

  function channelLabel(channel) {
    if (!channel) return "";
    if (CHANNEL_NAMES[channel]) return CHANNEL_NAMES[channel];
    if (channel.startsWith("mail:")) return channel.slice(5);
    return channel;
  }
  function identLabel(kind) {
    return IDENT_LABELS[kind] || kind;
  }

  const state = {
    listMode: "messages",   // "messages" | "clients" | "invoices"
    reader: "empty",        // "empty" | "message" | "client" | "settings" | "peppol" | "invoice"
    tab: "pending",
    query: "",
    messages: [],
    clients: [],
    selected: null,         // id (als tekst) van het geopende bericht
    selectedClient: null,   // id (als tekst) van de geopende klant
    stats: null,
    invTab: "wacht-op-betaling",
    invoices: [],
    mapItems: [],
    mapFolder: "",
    invoiceCount: null,
    selectedInvoice: null,
    loadId: 0,
    routeId: 0,
  };

  const $ = (sel) => document.querySelector(sel);
  let uidSeq = 0;
  const uid = (prefix) => `${prefix}-${++uidSeq}`;

  function h(tag, props = {}, ...children) {
    const node = document.createElement(tag);
    for (const [key, value] of Object.entries(props)) {
      if (value === undefined || value === null || value === false) continue;
      if (key === "class") node.className = value;
      else if (key === "text") node.textContent = value;
      else if (key.startsWith("on")) node.addEventListener(key.slice(2), value);
      else node.setAttribute(key, value === true ? "" : value);
    }
    for (const child of children.flat()) {
      if (child === null || child === undefined || child === false) continue;
      node.append(child instanceof Node ? child : document.createTextNode(String(child)));
    }
    return node;
  }

  async function api(path, options = {}) {
    const response = await fetch(path, {
      headers: { "Content-Type": "application/json" },
      ...options,
    });
    let data = null;
    try { data = await response.json(); } catch (_) { /* leeg antwoord */ }
    if (!response.ok) {
      const detail = data && data.detail;
      let message = response.statusText || "Er ging iets mis";
      let problems = [];
      if (typeof detail === "string") message = detail;
      else if (detail && typeof detail === "object") {
        problems = Array.isArray(detail.problems) ? detail.problems : [];
        message = detail.message || (problems.length ? "De factuur is niet geldig." : message);
      }
      const error = new Error(message);
      error.status = response.status;
      error.problems = problems;
      throw error;
    }
    return data;
  }

  function toast(text, isError = false) {
    const node = $("#toast");
    node.textContent = text;
    node.classList.toggle("error", isError);
    node.classList.add("show");
    clearTimeout(toast.timer);
    toast.timer = setTimeout(() => node.classList.remove("show"), 3200);
  }

  function formatTime(iso) {
    if (!iso) return "";
    const date = new Date(iso);
    const now = new Date();
    const sameDay = date.toDateString() === now.toDateString();
    return sameDay
      ? date.toLocaleTimeString("nl-NL", { hour: "2-digit", minute: "2-digit" })
      : date.toLocaleDateString("nl-NL", { day: "numeric", month: "short" });
  }

  function formatFull(iso) {
    if (!iso) return "";
    return new Date(iso).toLocaleString("nl-NL", { dateStyle: "long", timeStyle: "short" });
  }

  function localInputValue(date) {
    const pad = (n) => String(n).padStart(2, "0");
    return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}T${pad(date.getHours())}:${pad(date.getMinutes())}`;
  }

  function initials(name) {
    const clean = name.replace(/<.*>/, "").replace(/[^\p{L}\s]/gu, " ").trim();
    const parts = clean.split(/\s+/).filter(Boolean);
    if (!parts.length) return "?";
    return (parts[0][0] + (parts.length > 1 ? parts[parts.length - 1][0] : "")).toUpperCase();
  }

  function displaySender(sender) {
    const match = sender.match(/^(.*?)\s*<([^>]+)>$/);
    if (match && match[1].trim()) return match[1].trim();
    return match ? match[2] : sender;
  }

  function intentChip(intent) {
    if (!intent) return null;
    return h("span", { class: `chip ${intent}` }, INTENT_LABELS[intent] || intent);
  }

  function urgencyChip(urgency) {
    if (!urgency || urgency === "laag" || urgency === "normaal") return null;
    return h("span", { class: `chip ${urgency}` }, URGENCY_LABELS[urgency]);
  }

  function channelChip(channel) {
    if (!channel) return null;
    return h("span", { class: "chip", text: channelLabel(channel) });
  }

  function setReader(node) {
    const reader = $("#reader");
    reader.replaceChildren(node);
    reader.scrollTop = 0;
  }

  function loadingNode(text = "Laden…") {
    return h("div", { class: "loading", text });
  }

  function errorNode(title, message) {
    return h("div", { class: "empty" }, h("div", {}, h("h3", { text: title }), message));
  }

  /* ---------- navigatie ---------- */

  function navButton(label, hash, current, count = null, hot = false) {
    return h("button", {
      class: "nav-item",
      type: "button",
      "aria-current": current ? "true" : "false",
      onclick: () => {
        if (location.hash === hash) onRoute();
        else location.hash = hash;
      },
    },
      h("span", { text: label }),
      count === null ? null : h("span", { class: `count${hot && count > 0 ? " hot" : ""}`, text: count }),
    );
  }

  function renderNav() {
    const stats = state.stats || {};
    const counts = stats.intents || {};
    const total = Object.values(counts).reduce((a, b) => a + b, 0);
    const countFor = (tab) => {
      if (tab.id === "pending") return stats.pending ?? 0;
      if (tab.id === "ingepland") return stats.scheduled ?? 0;
      if (tab.id === "all") return total;
      return counts[tab.params.intent] || 0;
    };
    $("#nav").replaceChildren(...TABS.map((tab) => navButton(
      tab.label,
      `#${tab.id}`,
      state.listMode === "messages" && state.tab === tab.id,
      countFor(tab),
      tab.id === "pending",
    )));
    $("#nav-clients").replaceChildren(navButton("Alle klanten", "#klanten", state.listMode === "clients"));
    $("#nav-peppol").replaceChildren(navButton("Peppol-facturen", "#peppol", state.listMode === "invoices", state.invoiceCount, true));
    $("#seg").hidden = state.listMode !== "invoices";
    if (state.listMode === "invoices") renderSegment();
    $("#settings-btn").setAttribute("aria-pressed", String(state.reader === "settings"));
  }

  function updatePlaceholder() {
    $("#q").placeholder = state.listMode === "clients" ? "Zoek klanten"
      : state.listMode === "invoices" ? "Zoek facturen" : "Zoeken";
  }

  function currentTab() {
    return TABS.find((t) => t.id === state.tab) || TABS[0];
  }

  function highlightItems() {
    document.querySelectorAll(".item[data-id]").forEach((el) => {
      el.setAttribute("aria-selected", el.dataset.id === state.selected ? "true" : "false");
    });
    document.querySelectorAll(".item[data-client]").forEach((el) => {
      el.setAttribute("aria-selected", el.dataset.client === state.selectedClient ? "true" : "false");
    });
    document.querySelectorAll(".item[data-invoice]").forEach((el) => {
      el.setAttribute("aria-selected", el.dataset.invoice === state.selectedInvoice ? "true" : "false");
    });
  }

  /* ---------- berichtenlijst ---------- */

  async function loadList() {
    const loadId = ++state.loadId;
    const tab = currentTab();
    const params = new URLSearchParams(tab.params);
    if (state.query) params.set("q", state.query);
    $("#list-title").textContent = tab.label;
    try {
      const messages = await api(`/api/messages?${params}`);
      if (loadId !== state.loadId) return;
      state.messages = messages;
      renderList();
    } catch (error) {
      if (loadId !== state.loadId) return;
      $("#list-sub").textContent = `Kon de lijst niet laden: ${error.message}`;
    }
  }

  function renderList() {
    const tab = currentTab();
    const n = state.messages.length;
    $("#list-sub").textContent = n === 0
      ? (state.query ? "Geen resultaten" : "Niets hier")
      : `${n} ${n === 1 ? "bericht" : "berichten"}`;
    if (n === 0) {
      let empty = "Geen berichten in deze categorie.";
      if (tab.id === "pending" && !state.query) empty = "Alles is afgehandeld. Mooi werk.";
      if (tab.id === "ingepland" && !state.query) empty = "Er staan geen antwoorden ingepland.";
      $("#items").replaceChildren(h("div", { class: "loading", text: empty }));
      return;
    }
    $("#items").replaceChildren(...state.messages.map((m) => {
      const selected = String(m.id) === state.selected;
      return h("button", {
        class: "item",
        type: "button",
        role: "option",
        "aria-selected": selected ? "true" : "false",
        "data-id": String(m.id),
        onclick: () => { selectMessage(m.id); },
      },
        h("div", { class: "item-top" },
          m.draft_id ? h("span", { class: "unread-dot", title: "Concept wacht op goedkeuring" }) : null,
          h("span", { class: "item-sender", text: displaySender(m.sender) }),
          h("span", { text: formatTime(m.received_at) }),
        ),
        h("div", { class: "item-subject", text: m.subject || "(geen onderwerp)" }),
        h("div", { class: "item-summary", text: m.summary || "" }),
        h("div", { class: "chip-row" },
          intentChip(m.intent),
          channelChip(m.channel),
          m.draft_id ? h("span", { class: "chip wacht", text: "Concept klaar" }) : null,
        ),
      );
    }));
  }

  /* ---------- klantenlijst ---------- */

  async function loadClients() {
    const loadId = ++state.loadId;
    const params = new URLSearchParams();
    if (state.query) params.set("q", state.query);
    $("#list-title").textContent = "Klanten";
    try {
      const clients = await api(`/api/clients?${params}`);
      if (loadId !== state.loadId) return;
      state.clients = clients;
      renderClientList();
    } catch (error) {
      if (loadId !== state.loadId) return;
      $("#list-sub").textContent = `Kon de klanten niet laden: ${error.message}`;
    }
  }

  function renderClientList() {
    const n = state.clients.length;
    $("#list-sub").textContent = n === 0
      ? (state.query ? "Geen resultaten" : "Nog geen klanten")
      : `${n} ${n === 1 ? "klant" : "klanten"}`;
    if (n === 0) {
      $("#items").replaceChildren(h("div", {
        class: "loading",
        text: state.query ? "Geen klanten gevonden." : "Er zijn nog geen klanten.",
      }));
      return;
    }
    $("#items").replaceChildren(...state.clients.map((c) => {
      const selected = String(c.id) === state.selectedClient;
      const count = c.message_count || 0;
      return h("button", {
        class: "item",
        type: "button",
        role: "option",
        "aria-selected": selected ? "true" : "false",
        "data-client": String(c.id),
        onclick: () => { location.hash = `klant/${encodeURIComponent(c.id)}`; },
      },
        h("div", { class: "item-top" },
          h("span", { class: "item-sender", text: c.name || "(naamloos)" }),
          h("span", { text: formatTime(c.last_received) }),
        ),
        h("div", { class: "item-subject", text: `${count} ${count === 1 ? "bericht" : "berichten"}` }),
        h("div", { class: "chip-row" }, (c.channels || []).map((ch) => channelChip(ch))),
      );
    }));
  }

  /* ---------- bericht in het leesvenster ---------- */

  async function selectMessage(id) {
    const key = String(id);
    state.selected = key;
    state.reader = "message";
    state.selectedClient = null;
    highlightItems();
    setReader(loadingNode("Bericht openen…"));
    try {
      const message = await api(`/api/messages/${encodeURIComponent(key)}`);
      if (state.selected !== key || state.reader !== "message") return;
      renderMessage(message);
      if (window.matchMedia("(max-width: 860px)").matches) {
        document.querySelector(`.item[data-id="${CSS.escape(key)}"]`)?.scrollIntoView({ block: "nearest" });
      }
    } catch (error) {
      if (state.selected !== key) return;
      setReader(errorNode("Kon het bericht niet openen", error.message));
    }
  }

  function renderMessage(m) {
    const name = displaySender(m.sender);
    const address = (m.sender.match(/<([^>]+)>/) || [])[1] || (m.sender.includes("@") ? m.sender : "");
    const nameNode = m.client_id
      ? h("a", { class: "link", href: `#klant/${encodeURIComponent(m.client_id)}`, title: "Open klantgegevens", text: name })
      : h("span", { class: "name", text: name });

    const header = h("div", { class: "card" },
      h("div", { class: "from" },
        h("div", { class: "avatar", "aria-hidden": "true", text: initials(name) }),
        h("div", {},
          h("div", {}, nameNode),
          h("div", { class: "meta" },
            address ? h("span", { text: address }) : null,
            h("span", { text: formatFull(m.received_at) }),
            channelChip(m.channel),
          ),
        ),
      ),
      h("h1", { text: m.subject || "(geen onderwerp)" }),
      h("div", { class: "meta" },
        intentChip(m.intent),
        urgencyChip(m.urgency),
        h("span", { text: `Status: ${m.status}` }),
      ),
    );

    const summary = m.summary ? h("div", { class: "card" },
      h("h3", { text: "Samenvatting" }),
      h("p", { class: "summary-text", text: m.summary }),
    ) : null;

    const bodyCard = h("div", { class: "card" },
      h("h3", { text: "Bericht" }),
      h("p", { class: "body", text: m.body || "(leeg bericht)" }),
    );

    const activity = renderActivity(m);

    setReader(h("div", { class: "reader-inner" },
      header, summary, bodyCard, renderDraftCard(m), activity));
  }

  function renderDraftCard(m) {
    const pending = m.drafts.find((d) => d.status === "wacht op goedkeuring");
    const scheduled = m.drafts.find((d) => d.status === "ingepland");
    const sent = m.drafts.find((d) => d.status === "verzonden");
    if (pending) return renderPendingDraft(pending);
    if (scheduled) return renderScheduledDraft(scheduled);
    if (sent) {
      return h("div", { class: "card" },
        h("h3", { text: "Antwoord" }),
        h("p", { class: "sent-note", text: "✓ Verzonden" }),
        h("p", { class: "body mt", text: sent.body }),
      );
    }
    return h("div", { class: "card" },
      h("h3", { text: "Antwoord" }),
      h("p", { class: "hint flush", text: "Voor dit bericht is geen antwoord nodig." }),
    );
  }

  function renderChangeNotice(draft) {
    const hasPrevious = Boolean(draft.previous_body);
    const previous = hasPrevious
      ? h("p", { class: "prev-body", hidden: true, text: draft.previous_body })
      : null;
    const toggle = hasPrevious ? h("button", {
      class: "btn small",
      type: "button",
      "aria-expanded": "false",
      text: "Vorige versie tonen",
      onclick: () => {
        const show = previous.hidden;
        previous.hidden = !show;
        toggle.textContent = show ? "Vorige versie verbergen" : "Vorige versie tonen";
        toggle.setAttribute("aria-expanded", String(show));
      },
    }) : null;
    return h("div", {},
      h("div", { class: "notice info" },
        h("div", {},
          h("div", { text: `Bijgewerkt op basis van het nieuwe bericht: ${draft.change_summary}` }),
          toggle,
        ),
      ),
      previous,
    );
  }

  function renderWarnings(draft) {
    if (!draft.errors.length && !draft.reason) return null;
    const items = draft.errors.length ? draft.errors : [draft.reason];
    return h("div", { class: draft.errors.length ? "notice warn" : "notice info" },
      h("div", {},
        h("strong", { text: draft.errors.length ? "Let op: prijscontrole" : "Toelichting van het model" }),
        h("ul", {}, items.map((e) => h("li", { text: e }))),
      ),
    );
  }

  function renderPendingDraft(draft) {
    const textarea = h("textarea", { "aria-label": "Tekst van het antwoord" });
    textarea.value = draft.body;

    const select = h("select", { class: "input pill", "aria-label": "Verzendmoment" },
      h("option", { value: "now", text: "Nu verzenden" }),
      h("option", { value: "hour", text: "Over 1 uur" }),
      h("option", { value: "tomorrow", text: "Morgen om 09:00" }),
      h("option", { value: "custom", text: "Op een tijdstip…" }),
    );
    const custom = h("input", {
      class: "input pill",
      type: "datetime-local",
      "aria-label": "Tijdstip voor verzenden",
      min: localInputValue(new Date()),
      hidden: true,
    });
    const approve = h("button", { class: "btn primary", type: "button", text: "Goedkeuren en verzenden" });
    const reject = h("button", { class: "btn danger", type: "button", text: "Afwijzen" });
    const reset = h("button", { class: "btn ghost", type: "button", text: "Herstel concept" });

    const ui = { textarea, select, custom, approve };
    approve.addEventListener("click", () => approveDraft(draft, ui, false));
    reject.addEventListener("click", () => rejectDraft(draft.id, reject));
    reset.addEventListener("click", () => { textarea.value = draft.body; });
    select.addEventListener("change", () => {
      approve.textContent = select.value === "now" ? "Goedkeuren en verzenden" : "Inplannen";
      custom.hidden = select.value !== "custom";
      if (!custom.hidden) custom.focus();
    });

    return h("div", { class: "card draft" },
      h("h3", { text: "Concept-antwoord" }),
      draft.change_summary ? renderChangeNotice(draft) : null,
      renderWarnings(draft),
      textarea,
      h("div", { class: "actions" }, reset, h("span", { class: "spacer" }), reject, custom, select, approve),
      h("div", { class: "hint", text: "Wijzig de tekst gerust. Het verzenden gebeurt pas na goedkeuring." }),
    );
  }

  function renderScheduledDraft(draft) {
    const textarea = h("textarea", { readonly: true, "aria-label": "Ingepland antwoord" });
    textarea.value = draft.body;
    const when = draft.scheduled_for ? formatFull(draft.scheduled_for) : "onbekend tijdstip";
    const cancel = h("button", { class: "btn", type: "button", text: "Planning annuleren" });
    const reject = h("button", { class: "btn danger", type: "button", text: "Afwijzen" });
    cancel.addEventListener("click", () => cancelSchedule(draft.id, cancel));
    reject.addEventListener("click", () => rejectDraft(draft.id, reject));
    return h("div", { class: "card draft" },
      h("h3", { text: "Concept-antwoord" }),
      h("div", { class: "notice info" }, h("div", { text: `Ingepland voor ${when}` })),
      textarea,
      h("div", { class: "actions" }, h("span", { class: "spacer" }), cancel, reject),
    );
  }

  function sendAtFor(choice, customValue) {
    const now = new Date();
    if (choice === "now") return null;
    if (choice === "hour") return new Date(now.getTime() + 60 * 60 * 1000).toISOString();
    if (choice === "tomorrow") {
      const d = new Date(now);
      d.setDate(d.getDate() + 1);
      d.setHours(9, 0, 0, 0);
      return d.toISOString();
    }
    const when = new Date(customValue);
    if (!customValue || Number.isNaN(when.getTime())) {
      toast("Kies een geldig tijdstip.", true);
      return undefined;
    }
    if (when <= now) {
      toast("Kies een tijdstip in de toekomst.", true);
      return undefined;
    }
    return when.toISOString();
  }

  async function approveDraft(draft, ui, force) {
    const body = ui.textarea.value.trim();
    if (!body) { toast("Het antwoord is leeg.", true); return; }
    const sendAt = sendAtFor(ui.select.value, ui.custom.value);
    if (sendAt === undefined) return;
    const payload = { body };
    if (sendAt !== null) payload.send_at = sendAt;
    if (force) payload.force = true;

    ui.approve.disabled = true;
    try {
      const result = await api(`/api/drafts/${draft.id}/approve`, { method: "POST", body: JSON.stringify(payload) });
      toast(result.status === "ingepland" ? "Antwoord ingepland" : "Antwoord verzonden");
    } catch (error) {
      if (error.status === 409 && !force) {
        if (confirm(`${error.message}\n\nToch verzenden?`)) return approveDraft(draft, ui, true);
        toast("Verzenden geannuleerd.");
      } else {
        toast(error.message, true);
      }
      ui.approve.disabled = false;
      return;
    }
    await refresh();
  }

  async function rejectDraft(draftId, button) {
    if (!confirm("Dit concept afwijzen? Er wordt niets verzonden.")) return;
    button.disabled = true;
    try {
      await api(`/api/drafts/${draftId}/reject`, { method: "POST" });
      toast("Concept afgewezen");
      await refresh();
    } catch (error) {
      toast(error.message, true);
      button.disabled = false;
    }
  }

  async function cancelSchedule(draftId, button) {
    button.disabled = true;
    try {
      await api(`/api/drafts/${draftId}/cancel-schedule`, { method: "POST" });
      toast("Planning geannuleerd");
      await refresh();
    } catch (error) {
      toast(error.message, true);
      button.disabled = false;
    }
  }

  function renderActivity(m) {
    const log = m.log || [];
    return h("details", { class: "card activity" },
      h("summary", { text: `Activiteit (${log.length})` }),
      log.length
        ? h("ul", { class: "log-list" }, log.map((entry) => h("li", {},
            h("span", { class: "log-time", text: formatFull(entry.at) }),
            h("strong", { text: entry.event }),
            entry.detail ? h("span", { text: ` — ${entry.detail}` }) : null,
          )))
        : h("p", { class: "hint flush", text: "Nog geen activiteit." }),
    );

  /* ---------- klant ---------- */

  async function openClient(id, routeId) {
    const key = String(id);
    state.reader = "client";
    state.selected = null;
    state.selectedClient = key;
    highlightItems();
    setReader(loadingNode("Klant openen…"));
    try {
      const [client, all] = await Promise.all([
        api(`/api/clients/${encodeURIComponent(key)}`),
        api("/api/clients"),
      ]);
      if (routeId !== state.routeId) return;
      renderClient(client, all);
    } catch (error) {
      if (routeId !== state.routeId) return;
      setReader(errorNode("Kon de klant niet openen", error.message));
    }
  }

  async function patchClient(id, patch, message) {
    try {
      await api(`/api/clients/${encodeURIComponent(id)}`, { method: "PATCH", body: JSON.stringify(patch) });
      toast(message);
      return true;
    } catch (error) {
      toast(error.message, true);
      return false;
    }
  }

  function renderClient(client, all) {
    const id = String(client.id);
    let savedName = client.name || "";
    let savedNotes = client.notes || "";

    const title = h("h1", { text: savedName || "(naamloos)" });

    const nameId = uid("cname");
    const nameInput = h("input", { id: nameId, class: "input", type: "text", value: savedName, autocomplete: "off" });
    const saveName = async () => {
      const value = nameInput.value.trim();
      if (!value) {
        nameInput.value = savedName;
        toast("De naam mag niet leeg zijn.", true);
        return;
      }
      if (value === savedName) return;
      if (await patchClient(id, { name: value }, "Naam opgeslagen")) {
        savedName = value;
        nameInput.value = value;
        title.textContent = value;
        loadClients();
      }
    };
    nameInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter") { event.preventDefault(); saveName(); }
    });

    const notesId = uid("cnotes");
    const notesInput = h("textarea", { id: notesId, class: "input", });
    notesInput.value = savedNotes;
    const saveNotes = async () => {
      const value = notesInput.value;
      if (value === savedNotes) { toast("Geen wijzigingen om op te slaan."); return; }
      if (await patchClient(id, { notes: value }, "Notities opgeslagen")) {
        savedNotes = value;
      }
    };

    const identifiers = client.identifiers || [];
    const identCard = h("div", { class: "card" },
      h("h3", { text: "Identificatoren" }),
      identifiers.length
        ? h("ul", { class: "ident-list" }, identifiers.map((i) => h("li", { text: `${identLabel(i.kind)}: ${i.value}` })))
        : h("p", { class: "hint flush", text: "Nog geen identificatoren bekend." }),
    );

    const others = all.filter((c) => String(c.id) !== id);
    const mergeId = uid("merge");
    const mergeSelect = h("select", { id: mergeId, class: "input" },
      h("option", { value: "", text: "Kies een klant…" }),
      others.map((c) => h("option", { value: String(c.id), text: `${c.name || "(naamloos)"} (${c.message_count || 0})` })),
    );
    const mergeButton = h("button", { class: "btn", type: "button", text: "Samenvoegen" });
    mergeButton.addEventListener("click", async () => {
      const target = others.find((c) => String(c.id) === mergeSelect.value);
      if (!target) { toast("Kies eerst een klant.", true); return; }
      if (!confirm(`Alle berichten van "${savedName}" gaan naar "${target.name}". Dit kun je niet ongedaan maken.\n\nDoorgaan?`)) return;
      mergeButton.disabled = true;
      try {
        await api(`/api/clients/${encodeURIComponent(id)}/merge`, { method: "POST", body: JSON.stringify({ into: target.id }) });
        toast("Klanten samengevoegd");
        location.hash = `klant/${encodeURIComponent(target.id)}`;
      } catch (error) {
        toast(error.message, true);
        mergeButton.disabled = false;
      }
    });

    const messages = [...(client.messages || [])]
      .sort((a, b) => new Date(b.received_at) - new Date(a.received_at));
    const timeline = messages.length
      ? messages.map((msg) => h("button", {
          class: "tl-item",
          type: "button",
          onclick: () => { location.hash = `bericht/${encodeURIComponent(msg.id)}`; },
        },
          h("div", { class: "item-top" },
            channelChip(msg.channel),
            h("span", { text: formatTime(msg.received_at) }),
          ),
          h("div", { class: "item-subject", text: msg.subject || msg.summary || "(geen onderwerp)" }),
          h("div", { class: "chip-row" },
            intentChip(msg.intent),
            h("span", { class: "tl-status", text: msg.status || "" }),
          ),
        ))
      : [h("p", { class: "hint flush", text: "Nog geen berichten van deze klant." })];

    setReader(h("div", { class: "reader-inner" },
      h("a", { class: "link back", href: "#klanten", text: "← Alle klanten" }),
      title,
      h("div", { class: "card" },
        h("h3", { text: "Gegevens" }),
        h("div", { class: "field" },
          h("label", { for: nameId, text: "Naam" }),
          h("div", { class: "row-inline" }, nameInput, h("button", { class: "btn", type: "button", text: "Opslaan", onclick: saveName })),
        ),
        h("div", { class: "field" },
          h("label", { for: notesId, text: "Notities" }),
          notesInput,
          h("div", { class: "actions" },
            h("span", { class: "hint flush", text: `${messages.length} ${messages.length === 1 ? "bericht" : "berichten"}` }),
            h("span", { class: "spacer" }),
            h("button", { class: "btn", type: "button", text: "Notities opslaan", onclick: saveNotes }),
          ),
        ),
      ),
      identCard,
      h("div", { class: "card" },
        h("h3", { text: "Samenvoegen" }),
        h("p", { class: "hint flush", text: "Berichten en gegevens van deze klant gaan naar de gekozen klant." }),
        h("div", { class: "row-inline mt" },
          h("label", { for: mergeId, class: "sr-only", text: "Samenvoegen met" }),
          mergeSelect, mergeButton,
        ),
      ),
      h("div", { class: "card" },
        h("h3", { text: "Berichten" }),
        timeline,
      ),
    ));
    highlightItems();
  }

  function readSettings() {
    const val = (id) => document.getElementById(id).value.trim();
    const checked = (id) => document.getElementById(id).checked;
    const values = {
      WERKER_AUTOSEND: checked("s-autosend") ? "true" : "false",
      WERKER_AUTOSEND_INTENTS: val("s-intents"),
      WERKER_MIN_CONFIDENCE: val("s-minconf"),
      WERKER_MAX_AUTO_AMOUNT: val("s-maxamount"),
      WERKER_OWN_ADDRESSES: val("s-own"),
      WERKER_BLOCKLIST: val("s-blocklist"),
      WERKER_SYNC_MINUTES: val("s-sync"),
      WERKER_PRICES_CSV_URL: val("s-prices"),
      WERKER_IMESSAGE: checked("s-imessage") ? "true" : "false",
      WHATSAPP_PHONE_NUMBER_ID: val("s-waid"),
      WERKER_THEME: val("s-theme"),
      PEPPOL_PROVIDER: val("s-pepprov"),
      PEPPOL_LEGAL_ENTITY_ID: val("s-pepleg"),
    };
    // Geheimen: alleen meesturen als er iets is ingetypt.
    const secrets = {};
    for (const [key, id] of Object.entries(SECRET_FIELDS)) {
      const typed = document.getElementById(id).value;
      if (typed) secrets[key] = typed;
    }
    const mailboxes = [...document.querySelectorAll(".mailbox-card")].map((card) => {
      const input = (key) => card.querySelector(`[data-f="${key}"]`);
      const text = (key) => input(key).value.trim();
      const port = (key) => (text(key) === "" ? null : Number(text(key)));
      const mailbox = {
        name: text("name"),
        host: text("host"),
        port: port("port"),
        user: text("user"),
        smtp_host: text("smtp_host"),
        smtp_port: port("smtp_port"),
        sender: text("sender"),
        folder: text("folder"),
      };
      const password = input("password").value;
      if (password) mailbox.password = password;
      return mailbox;
    });
    return { values, secrets, mailboxes };
  }

  async function saveSettings(event) {
    event.preventDefault();
    const form = event.currentTarget;
    const submit = form.querySelector('button[type="submit"]');
    const errorBox = $("#settings-error");
    errorBox.hidden = true;
    submit.disabled = true;
    try {
      const data = await api("/api/settings", { method: "PUT", body: JSON.stringify(readSettings()) });
      renderSettings(data);
      toast("Instellingen opgeslagen");
    } catch (error) {
      errorBox.textContent = `Niet opgeslagen: ${error.message}`;
      errorBox.hidden = false;
      toast(error.message, true);
      submit.disabled = false;
    }
  }

  /* ---------- Peppol-facturen ---------- */

  const money = (amount, currency) => {
    const n = Number(amount);
    if (!Number.isFinite(n)) return "";
    try {
      return new Intl.NumberFormat("nl-NL", { style: "currency", currency: currency || "EUR" }).format(n);
    } catch (_) {
      return `${n.toFixed(2)} ${currency || ""}`.trim();
    }
  };

  function formatDate(iso) {
    if (!iso) return "";
    const value = /^\d{4}-\d{2}-\d{2}$/.test(iso) ? `${iso}T00:00:00` : iso;
    return new Date(value).toLocaleDateString("nl-NL", { day: "numeric", month: "long", year: "numeric" });
  }

  function statusChip(status) {
    return h("span", { class: `chip ${INVOICE_STATUS_CLASS[status] || ""}`, text: status });
  }

  function readFileText(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(String(reader.result));
      reader.onerror = () => reject(new Error("Kon het bestand niet lezen."));
      reader.readAsText(file);
    });
  }

  async function copyText(text) {
    try {
      await navigator.clipboard.writeText(text);
      toast("Pad gekopieerd");
    } catch (_) {
      toast("Kopiëren lukt niet; selecteer het pad handmatig.", true);
    }
  }

  function renderSegment() {
    $("#seg").replaceChildren(...INVOICE_TABS.map((tab) => h("button", {
      class: "seg-btn",
      type: "button",
      "aria-pressed": tab.slug === state.invTab ? "true" : "false",
      text: tab.label,
      onclick: () => {
        const hash = `peppol/${tab.slug}`;
        if (location.hash === `#${hash}`) onRoute();
        else location.hash = hash;
      },
    })));
  }

  async function loadInvoiceList() {
    const loadId = ++state.loadId;
    const tab = INVOICE_TABS.find((t) => t.slug === state.invTab) || INVOICE_TABS[0];
    $("#list-title").textContent = "Peppol-facturen";
    try {
      if (tab.slug === "in-map") {
        const data = await api("/api/peppol/map");
        if (loadId !== state.loadId) return;
        state.mapItems = data.items || [];
        state.mapFolder = data.folder || "";
      } else {
        const invoices = await api(`/api/invoices?status=${encodeURIComponent(tab.status)}`);
        if (loadId !== state.loadId) return;
        state.invoices = invoices;
      }
      renderInvoiceView();
    } catch (error) {
      if (loadId !== state.loadId) return;
      $("#list-sub").textContent = `Kon de facturen niet laden: ${error.message}`;
    }
  }

  function matchesQuery(...fields) {
    if (!state.query) return true;
    const q = state.query.toLowerCase();
    return fields.some((f) => String(f || "").toLowerCase().includes(q));
  }

  function renderInvoiceView() {
    const tab = INVOICE_TABS.find((t) => t.slug === state.invTab) || INVOICE_TABS[0];
    if (tab.slug === "in-map") return renderMapList();
    const items = state.invoices.filter((inv) => matchesQuery(inv.number, inv.buyer_name));
    const n = items.length;
    $("#list-sub").textContent = n === 0
      ? (state.query ? "Geen resultaten" : "Geen facturen in deze status")
      : `${n} ${n === 1 ? "factuur" : "facturen"}`;
    if (n === 0) {
      $("#items").replaceChildren(h("div", { class: "loading", text: state.query ? "Geen facturen gevonden." : "Geen facturen in deze status." }));
      return;
    }
    $("#items").replaceChildren(...items.map((inv) => h("button", {
      class: "item",
      type: "button",
      role: "option",
      "aria-selected": String(inv.id) === state.selectedInvoice ? "true" : "false",
      "data-invoice": String(inv.id),
      onclick: () => { location.hash = `factuur/${encodeURIComponent(inv.id)}`; },
    },
      h("div", { class: "item-top" },
        h("span", { class: "item-sender", text: inv.buyer_name || "(onbekende koper)" }),
        h("span", { text: money(inv.total_incl, inv.currency) }),
      ),
      h("div", { class: "item-subject", text: `Factuur ${inv.number}` }),
      h("div", { class: "item-summary", text: inv.due_date ? `Vervalt ${formatDate(inv.due_date)}` : "" }),
      h("div", { class: "chip-row" }, statusChip(inv.status)),
    )));
  }

  function renderMapList() {
    const items = state.mapItems.filter((item) => matchesQuery(item.number, item.reason));
    const n = items.length;
    $("#list-sub").textContent = n === 0
      ? (state.query ? "Geen resultaten" : "Map is leeg")
      : `${n} ${n === 1 ? "factuur" : "facturen"} in ${state.mapFolder}`;
    if (n === 0) {
      $("#items").replaceChildren(h("div", { class: "loading", text: state.query ? "Geen facturen gevonden." : "Er staan geen facturen in de map." }));
      return;
    }
    $("#items").replaceChildren(...items.map((item) => {
      const retry = h("button", { class: "btn small", type: "button", text: "Opnieuw proberen" });
      retry.addEventListener("click", () => invoiceAction(item.invoice_id, "send", "Opnieuw geprobeerd", retry));
      return h("div", { class: "item" },
        h("div", { class: "item-top" },
          h("a", { class: "link", href: `#factuur/${encodeURIComponent(item.invoice_id)}`, text: `Factuur ${item.number}` }),
        ),
        h("div", { class: "item-subject", text: item.reason || "Onbekende reden" }),
        h("div", { class: "item-summary", text: item.path || "" }),
        h("div", { class: "chip-row" }, retry),
      );
    }));
  }

  function importCard(title, hint, accept, buttonLabel, handler) {
    const id = uid("file");
    const input = h("input", { id, class: "input", type: "file", accept });
    const warn = h("div", { class: "notice warn", role: "alert", hidden: true });
    const button = h("button", { class: "btn primary", type: "button", disabled: true, text: buttonLabel });
    input.addEventListener("change", () => {
      button.disabled = !input.files.length;
      warn.hidden = true;
    });
    button.addEventListener("click", () => handler(input, button, warn));
    return h("div", { class: "card" },
      h("h3", { text: title }),
      h("p", { class: "hint flush", text: hint }),
      field(id, "Bestand kiezen", input),
      warn,
      h("div", { class: "actions" }, button),
    );
  }

  async function importInvoice(input, button, warn) {
    const file = input.files[0];
    if (!file) return;
    button.disabled = true;
    warn.hidden = true;
    try {
      const xml = await readFileText(file);
      const result = await api("/api/invoices/import", { method: "POST", body: JSON.stringify({ xml }) });
      toast("Factuur geïmporteerd");
      location.hash = `factuur/${encodeURIComponent(result.id)}`;
    } catch (error) {
      if (error.status === 422 && error.problems.length) {
        warn.replaceChildren(
          h("div", {},
            h("strong", { text: "Factuur niet geïmporteerd" }),
            h("ul", {}, error.problems.map((p) => h("li", { text: p }))),
          ),
        );
        warn.hidden = false;
      } else {
        toast(error.message, true);
      }
      button.disabled = !input.files.length;
    }
  }

  async function importBank(input, button, warn) {
    const file = input.files[0];
    if (!file) return;
    button.disabled = true;
    warn.hidden = true;
    try {
      const csv = await readFileText(file);
      const result = await api("/api/invoices/bank", { method: "POST", body: JSON.stringify({ csv }) });
      const matched = result.matched || [];
      toast(matched.length
        ? `${matched.length} ${matched.length === 1 ? "factuur" : "facturen"} als betaald gemarkeerd: ${matched.join(", ")}`
        : "Geen openstaande facturen gevonden in het bankbestand");
      input.value = "";
      await refresh();
    } catch (error) {
      toast(error.message, true);
    } finally {
      button.disabled = !input.files.length;
    }
  }

  async function openPeppolOverview(routeId) {
    state.reader = "peppol";
    state.selectedInvoice = null;
    setReader(loadingNode("Laden…"));
    let settings = {};
    try { settings = await api("/api/settings"); } catch (_) { /* pagina werkt ook zonder */ }
    if (routeId !== state.routeId) return;
    const path = settings.peppol_map || "";
    const connected = Boolean(settings.peppol_connected);
    const copy = h("button", { class: "btn small", type: "button", text: "Kopieer pad", onclick: () => copyText(path) });
    const status = connected
      ? h("div", { class: "notice info" }, h("div", { text: "Er is een Peppol access point gekoppeld. Betaalde facturen worden automatisch verzonden." }))
      : h("div", { class: "notice warn" }, h("div", {},
          h("div", { text: "Er is nog geen Peppol access point gekoppeld; facturen komen in de map:" }),
          h("div", { class: "path-row" }, h("code", { class: "path", text: path || "(niet ingesteld)" }), path ? copy : null),
        ));
    setReader(h("div", { class: "reader-inner" },
      h("h1", { text: "Peppol-facturen" }),
      h("p", { class: "section-intro", text: "Facturen gaan via Peppol zodra de betaling binnen is. Markeer een factuur als betaald of importeer een bankbestand; de factuur wordt dan verzonden." }),
      status,
      h("div", { class: "grid-2" },
        importCard("Factuur importeren", "Importeer een UBL-factuur (.xml). Ongeldige facturen worden niet opgeslagen.", ".xml,text/xml,application/xml", "Factuur importeren", importInvoice),
        importCard("Bankbestand importeren", "Facturen worden als betaald gemarkeerd wanneer het factuurnummer en het exacte bedrag in het bankbestand staan.", ".csv,text/csv", "Bankbestand importeren", importBank),
      ),
    ));
  }

  async function invoiceAction(id, action, message, button) {
    if (button) button.disabled = true;
    try {
      await api(`/api/invoices/${encodeURIComponent(id)}/${action}`, { method: "POST" });
      toast(message);
      await refresh();
    } catch (error) {
      toast(error.message, true);
      if (button) button.disabled = false;
    }
  }

  async function openInvoice(id, routeId) {
    const key = String(id);
    state.reader = "invoice";
    state.selected = null;
    state.selectedInvoice = key;
    highlightItems();
    setReader(loadingNode("Factuur openen…"));
    try {
      const invoice = await api(`/api/invoices/${encodeURIComponent(key)}`);
      if (routeId !== state.routeId) return;
      renderInvoice(invoice);
    } catch (error) {
      if (routeId !== state.routeId) return;
      setReader(errorNode("Kon de factuur niet openen", error.message));
    }
  }

  function renderInvoice(inv) {
    const rows = [
      ["Koper", inv.buyer_name],
      ["Peppol-adres", inv.buyer_endpoint],
      ["Factuurdatum", formatDate(inv.issue_date)],
      ["Vervaldatum", formatDate(inv.due_date)],
      ["Totaal", money(inv.total_incl, inv.currency)],
      ["Betaald op", inv.paid_at ? formatFull(inv.paid_at) : ""],
      ["Verzonden op", inv.sent_at ? formatFull(inv.sent_at) : ""],
    ].filter(([, value]) => value);

    const markPaid = inv.status === "wacht op betaling"
      ? h("button", { class: "btn primary", type: "button", text: "Markeer als betaald" }) : null;
    const send = (inv.status === "in map" || inv.status === "te verzenden")
      ? h("button", { class: "btn primary", type: "button", text: inv.status === "in map" ? "Opnieuw verzenden" : "Verzenden" }) : null;
    if (markPaid) markPaid.addEventListener("click", () => invoiceAction(inv.id, "mark-paid", "Factuur als betaald gemarkeerd", markPaid));
    if (send) send.addEventListener("click", () => invoiceAction(inv.id, "send", "Verzending gestart", send));

    setReader(h("div", { class: "reader-inner" },
      h("h1", { text: `Factuur ${inv.number}` }),
      h("div", { class: "meta" }, statusChip(inv.status)),
      h("div", { class: "card mt" },
        h("h3", { text: "Gegevens" }),
        h("dl", { class: "kv" }, rows.flatMap(([k, v]) => [h("dt", { text: k }), h("dd", { text: String(v) })])),
      ),
      inv.last_error ? h("div", { class: "notice warn" }, h("div", {},
        h("strong", { text: "Laatste fout" }),
        h("div", { text: inv.last_error }),
      )) : null,
      h("div", { class: "actions" }, markPaid, send),
      h("details", { class: "card activity" },
        h("summary", { text: "Bekijk XML" }),
        h("pre", { class: "xml", text: inv.xml || "(geen XML opgeslagen)" }),
      ),
    ));
  }

  /* ---------- data verversen ---------- */

  async function loadStats() {
    const [stats, toSend, inMap] = await Promise.all([
      api("/api/stats"),
      api(`/api/invoices?status=${encodeURIComponent("te verzenden")}`).catch(() => []),
      api(`/api/invoices?status=${encodeURIComponent("in map")}`).catch(() => []),
    ]);
    state.stats = stats;
    state.invoiceCount = toSend.length + inMap.length;
    renderNav();
  }

  async function refresh() {
    try {
      await loadStats();
      if (state.listMode === "clients") await loadClients();
      else if (state.listMode === "invoices") await loadInvoiceList();
      else await loadList();
      if (state.reader === "message" && state.selected !== null) await selectMessage(state.selected);
      if (state.reader === "invoice" && state.selectedInvoice !== null) await openInvoice(state.selectedInvoice, state.routeId);
    } catch (error) {
      toast(error.message, true);
    }
  }

  /* ---------- routing (hash) ---------- */

  function parseRoute() {
    const raw = location.hash.replace(/^#/, "");
    const slash = raw.indexOf("/");
    const head = slash === -1 ? raw : raw.slice(0, slash);
    let arg = slash === -1 ? "" : raw.slice(slash + 1);
    try { arg = decodeURIComponent(arg); } catch (_) { /* laat ruwe waarde staan */ }
    if (head === "klanten") return { view: "clients" };
    if (head === "klant" && arg) return { view: "client", id: arg };
    if (head === "bericht" && arg) return { view: "message", id: arg };
    if (head === "instellingen") return { view: "settings" };
    if (head === "peppol") {
      const slug = INVOICE_TABS.some((t) => t.slug === arg) ? arg : "wacht-op-betaling";
      return { view: "invoices", tab: slug };
    }
    if (head === "factuur" && arg) return { view: "invoice", id: arg };
    const tab = TABS.find((t) => t.id === head);
    return { view: "messages", tab: tab ? tab.id : "pending" };
  }

  function showEmptyReader() {
    state.reader = "empty";
    const hint = state.listMode === "clients"
      ? "Kies een klant uit de lijst."
      : h("div", {}, "Gebruik ", h("kbd", { text: "j" }), " en ", h("kbd", { text: "k" }), " om door de lijst te bewegen.");
    setReader(h("div", { class: "empty" }, h("div", {}, h("h3", { text: state.listMode === "clients" ? "Geen klant geopend" : "Kies een bericht" }), hint)));
  }

  async function onRoute() {
    const route = parseRoute();
    const routeId = ++state.routeId;

    if (route.view === "messages") {
      Object.assign(state, { listMode: "messages", tab: route.tab, selected: null, selectedClient: null });
      renderNav(); updatePlaceholder();
      showEmptyReader();
      await loadList();
    } else if (route.view === "clients") {
      Object.assign(state, { listMode: "clients", selected: null, selectedClient: null });
      renderNav(); updatePlaceholder();
      showEmptyReader();
      await loadClients();
    } else if (route.view === "client") {
      Object.assign(state, { listMode: "clients", selected: null, selectedClient: String(route.id) });
      renderNav(); updatePlaceholder();
      await Promise.all([loadClients(), openClient(route.id, routeId)]);
    } else if (route.view === "message") {
      Object.assign(state, { listMode: "messages", selectedClient: null });
      renderNav(); updatePlaceholder();
      await Promise.all([loadList(), selectMessage(route.id)]);
    } else if (route.view === "invoices") {
      Object.assign(state, { listMode: "invoices", invTab: route.tab, selected: null, selectedClient: null, selectedInvoice: null });
      renderNav(); updatePlaceholder();
      await Promise.all([loadInvoiceList(), openPeppolOverview(routeId)]);
    } else if (route.view === "invoice") {
      Object.assign(state, { listMode: "invoices", selected: null, selectedClient: null, selectedInvoice: String(route.id) });
      renderNav(); updatePlaceholder();
      await Promise.all([loadInvoiceList(), openInvoice(route.id, routeId)]);
    } else if (route.view === "settings") {
      Object.assign(state, { selected: null, selectedClient: null });
      renderNav(); updatePlaceholder();
      await Promise.all([
        state.listMode === "clients" ? loadClients() : loadList(),
        openSettings(routeId),
      ]);
    }
  }

  /* ---------- toetsenbord ---------- */

  function moveSelection(step) {
    if (!state.messages.length) return;
    const index = state.messages.findIndex((m) => String(m.id) === state.selected);
    const next = state.messages[Math.min(Math.max(index + step, 0), state.messages.length - 1)];
    if (next) {
      selectMessage(next.id);
      document.querySelector(`.item[data-id="${CSS.escape(String(next.id))}"]`)?.scrollIntoView({ block: "nearest" });
    }
  }

  document.addEventListener("keydown", (event) => {
    const typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName || "");
    if (typing || event.metaKey || event.ctrlKey || event.altKey) return;
    if (event.key === "/") { event.preventDefault(); $("#q").focus(); return; }
    if (state.listMode !== "messages") return;
    if (event.key === "j") moveSelection(1);
    if (event.key === "k") moveSelection(-1);
  });

  /* ---------- zoeken & sync ---------- */

  let searchTimer;
  $("#q").addEventListener("input", (event) => {
    const value = event.target.value.trim();
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => {
      state.query = value;
      if (state.listMode === "clients") loadClients();
      else if (state.listMode === "invoices") renderInvoiceView();
      else loadList();
    }, 250);
  });

  $("#sync").addEventListener("click", async (event) => {
    const button = event.currentTarget;
    button.disabled = true;
    button.textContent = "Bezig…";
    try {
      const result = await api("/api/sync", { method: "POST" });
      toast(result.processed ? `${result.processed} nieuwe berichten verwerkt` : "Geen nieuwe berichten");
      await refresh();
    } catch (error) {
      toast(error.message, true);
    } finally {
      button.disabled = false;
      button.textContent = "Synchroniseer";
    }
  });

  $("#settings-btn").addEventListener("click", () => {
    if (location.hash === "#instellingen") onRoute();
    else location.hash = "instellingen";
  });

  window.addEventListener("hashchange", onRoute);
  setInterval(() => { loadStats().catch(() => {}); }, 60000);

  if (!location.hash) history.replaceState(null, "", "#pending");
  loadStats().catch(() => {});
  api("/api/settings").then((data) => applyTheme(data.values.WERKER_THEME)).catch(() => {});
  onRoute();
})();
</script>
</body>
</html>
