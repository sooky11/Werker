  /* ---------- back-up ---------- */

  function backupControls() {
    const note = h("div", { class: "notice warn", role: "alert", hidden: true });
    const button = h("button", { class: "btn icon-btn", type: "button" }, svgIcon("download"), h("span", { text: "Back-up downloaden" }));
    button.addEventListener("click", () => downloadBackup(button, note));
    return h("div", {},
      note,
      h("div", { class: "actions" },
        h("span", { class: "hint flush", text: "Alleen voor beheerders." }),
        h("span", { class: "spacer" }),
        button),
    );
  }

  async function downloadBackup(button, note) {
    button.disabled = true;
    note.hidden = true;
    try {
      const response = await fetch("/api/backup");
      if (!response.ok) {
        const data = await response.json().catch(() => null);
        throw new Error((data && typeof data.detail === "string" && data.detail) || "De back-up is mislukt.");
      }
      const blob = await response.blob();
      const disposition = response.headers.get("content-disposition") || "";
      const match = disposition.match(/filename="?([^";]+)"?/i);
      const name = match ? match[1] : `werker-backup-${new Date().toISOString().slice(0, 10)}.db`;
      const url = URL.createObjectURL(blob);
      const link = h("a", { href: url, download: name, hidden: true });
      document.body.append(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      toast("Back-up gedownload");
    } catch (error) {
      note.replaceChildren(h("div", { text: error.message }));
      note.hidden = false;
      toast(error.message, true);
    } finally {
      button.disabled = false;
    }
  }

  function readSettings() {
    const val = (id) => document.getElementById(id).value.trim();
    const checked = (id) => document.getElementById(id).checked;
    const values = {
      WERKER_AUTOSEND: checked("s-autosend") ? "true" : "false",
      WERKER_AUTOSEND_INTENTS: val("s-intents"),
      WERKER_MIN_CONFIDENCE: val("s-minconf"),
      WERKER_MAX_AUTO_AMOUNT: val("s-maxamount"),
      WERKER_OWN_ADDRESSES: val("s-own"),
      WERKER_BLOCKLIST: val("s-blocklist"),
      WERKER_SYNC_MINUTES: val("s-sync"),
      WERKER_PRICES_CSV_URL: val("s-prices"),
      WERKER_IMESSAGE: checked("s-imessage") ? "true" : "false",
      WHATSAPP_PHONE_NUMBER_ID: val("s-waid"),
      WERKER_THEME: val("s-theme"),
      PEPPOL_PROVIDER: val("s-pepprov"),
      PEPPOL_LEGAL_ENTITY_ID: val("s-pepleg"),
      WERKER_RETENTION_DAYS: val("s-retention") || "0",
      WERKER_CALENDAR_ID: val("s-calid"),
      WERKER_CALENDAR_TOKEN: val("s-caltoken"),
      WERKER_OUTLOOK_CLIENT_ID: val("s-olclient"),
      WERKER_OUTLOOK_TOKEN_CACHE: val("s-oltoken"),
      WERKER_UNDO_SECONDS: val("s-undo") || "0",
      WERKER_AI_PRICE_INPUT: val("s-aiin").replace(",", "."),
      WERKER_AI_PRICE_OUTPUT: val("s-aiout").replace(",", "."),
      WHATSAPP_TEMPLATE_NAME: val("s-watpl"),
      WHATSAPP_TEMPLATE_LANG: val("s-walang") || "nl",
      WERKER_SIGNATURES: JSON.stringify(readSignatures()),
    };
    // Geheimen: alleen meesturen als er iets is ingetypt.
    const secrets = {};
    for (const [key, id] of Object.entries(SECRET_FIELDS)) {
      const typed = document.getElementById(id).value;
      if (typed) secrets[key] = typed;
    }
    const mailboxes = [...document.querySelectorAll(".mailbox-card")].map((card) => {
      const input = (key) => card.querySelector(`[data-f="${key}"]`);
      const text = (key) => input(key).value.trim();
      const port = (key) => (text(key) === "" ? null : Number(text(key)));
      const mailbox = {
        name: text("name"),
        host: text("host"),
        port: port("port"),
        user: text("user"),
        smtp_host: text("smtp_host"),
        smtp_port: port("smtp_port"),
        sender: text("sender"),
        folder: text("folder"),
      };
      const password = input("password").value;
      if (password) mailbox.password = password;
      return mailbox;
    });
    // Alle teamaccounts in de lijst; een leeg wachtwoord laat het bestaande wachtwoord staan.
    const users = [...document.querySelectorAll("[data-user-row]")].map((row) => {
      const pick = (key) => row.querySelector(`[data-u="${key}"]`);
      const user = { name: pick("name").value.trim(), role: pick("role").value };
      const password = pick("password").value;
      if (password) user.password = password;
      return user;
    }).filter((user) => user.name);
    // Zonder teamaccounts (en zonder nieuwe) de lijst niet meesturen: een lege lijst zou "geen beheerder" betekenen.
    return { values, secrets, mailboxes, users: users.length || state.hadUsers ? users : undefined };
  }

  async function saveSettings(event) {
    event.preventDefault();
    const form = event.currentTarget;
    const submit = form.querySelector('button[type="submit"]');
    const errorBox = $("#settings-error");
    errorBox.hidden = true;
    submit.disabled = true;
    try {
      const data = await api("/api/settings", { method: "PUT", body: JSON.stringify(readSettings()) });
      renderSettings(data);
      toast("Instellingen opgeslagen");
    } catch (error) {
      errorBox.textContent = `Niet opgeslagen: ${error.message}`;
      errorBox.hidden = false;
      toast(error.message, true);
      submit.disabled = false;
    }
  }

  /* ---------- Peppol-facturen ---------- */

  const money = (amount, currency) => {
    const n = Number(amount);
    if (!Number.isFinite(n)) return "";
    try {
      return new Intl.NumberFormat("nl-NL", { style: "currency", currency: currency || "EUR" }).format(n);
    } catch (_) {
      return `${n.toFixed(2)} ${currency || ""}`.trim();
    }
  };

  function formatDate(iso) {
    if (!iso) return "";
    const value = /^\d{4}-\d{2}-\d{2}$/.test(iso) ? `${iso}T00:00:00` : iso;
    return new Date(value).toLocaleDateString("nl-NL", { day: "numeric", month: "long", year: "numeric" });
  }

  function statusChip(status) {
    return h("span", { class: `chip ${INVOICE_STATUS_CLASS[status] || ""}`, text: status });
  }

  function readFileText(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(String(reader.result));
      reader.onerror = () => reject(new Error("Kon het bestand niet lezen."));
      reader.readAsText(file);
    });
  }

  async function copyText(text) {
    try {
      await navigator.clipboard.writeText(text);
      toast("Pad gekopieerd");
    } catch (_) {
      toast("Kopiëren lukt niet; selecteer het pad handmatig.", true);
    }
  }

  function renderSegment() {
    $("#seg").replaceChildren(...INVOICE_TABS.map((tab) => h("button", {
      class: "seg-btn",
      type: "button",
      "aria-pressed": tab.slug === state.invTab ? "true" : "false",
      text: tab.label,
      onclick: () => {
        const hash = `peppol/${tab.slug}`;
        if (location.hash === `#${hash}`) onRoute();
        else location.hash = hash;
      },
    })));
  }

  async function loadInvoiceList() {
    const loadId = ++state.loadId;
    const tab = INVOICE_TABS.find((t) => t.slug === state.invTab) || INVOICE_TABS[0];
    $("#list-title").textContent = "Peppol-facturen";
    try {
      if (tab.slug === "in-map") {
        const data = await api("/api/peppol/map");
        if (loadId !== state.loadId) return;
        state.mapItems = data.items || [];
        state.mapFolder = data.folder || "";
      } else {
        const invoices = await api(`/api/invoices?status=${encodeURIComponent(tab.status)}`);
        if (loadId !== state.loadId) return;
        state.invoices = invoices;
      }
      renderInvoiceView();
    } catch (error) {
      if (loadId !== state.loadId) return;
      $("#list-sub").textContent = `Kon de facturen niet laden: ${error.message}`;
    }
  }

  function matchesQuery(...fields) {
    if (!state.query) return true;
    const q = state.query.toLowerCase();
    return fields.some((f) => String(f || "").toLowerCase().includes(q));
  }

  function renderInvoiceView() {
    const tab = INVOICE_TABS.find((t) => t.slug === state.invTab) || INVOICE_TABS[0];
    if (tab.slug === "in-map") return renderMapList();
    const items = state.invoices.filter((inv) => matchesQuery(inv.number, inv.buyer_name));
    const n = items.length;
    $("#list-sub").textContent = n === 0
      ? (state.query ? "Geen resultaten" : "Geen facturen in deze status")
      : `${n} ${n === 1 ? "factuur" : "facturen"}`;
    if (n === 0) {
      $("#items").replaceChildren(h("div", { class: "loading", text: state.query ? "Geen facturen gevonden." : "Geen facturen in deze status." }));
      return;
    }
    $("#items").replaceChildren(...items.map((inv) => h("button", {
      class: "item",
      type: "button",
      role: "option",
      "aria-selected": String(inv.id) === state.selectedInvoice ? "true" : "false",
      "data-invoice": String(inv.id),
      onclick: () => { location.hash = `factuur/${encodeURIComponent(inv.id)}`; },
    },
      h("div", { class: "item-top" },
        h("span", { class: "item-sender", text: inv.buyer_name || "(onbekende koper)" }),
        h("span", { text: money(inv.total_incl, inv.currency) }),
      ),
      h("div", { class: "item-subject", text: `Factuur ${inv.number}` }),
      h("div", { class: "item-summary", text: inv.due_date ? `Vervalt ${formatDate(inv.due_date)}` : "" }),
      h("div", { class: "chip-row" }, statusChip(inv.status)),
    )));
  }

  function renderMapList() {
    const items = state.mapItems.filter((item) => matchesQuery(item.number, item.reason));
    const n = items.length;
    $("#list-sub").textContent = n === 0
      ? (state.query ? "Geen resultaten" : "Map is leeg")
      : `${n} ${n === 1 ? "factuur" : "facturen"} in ${state.mapFolder}`;
    if (n === 0) {
      $("#items").replaceChildren(h("div", { class: "loading", text: state.query ? "Geen facturen gevonden." : "Er staan geen facturen in de map." }));
      return;
    }
    $("#items").replaceChildren(...items.map((item) => {
      const retry = h("button", { class: "btn small", type: "button", text: "Opnieuw proberen" });
      retry.addEventListener("click", () => invoiceAction(item.invoice_id, "send", "Opnieuw geprobeerd", retry));
      return h("div", { class: "item" },
        h("div", { class: "item-top" },
          h("a", { class: "link", href: `#factuur/${encodeURIComponent(item.invoice_id)}`, text: `Factuur ${item.number}` }),
        ),
        h("div", { class: "item-subject", text: item.reason || "Onbekende reden" }),
        h("div", { class: "item-summary", text: item.path || "" }),
        h("div", { class: "chip-row" }, retry),
      );
    }));
  }

  function importCard(title, hint, accept, buttonLabel, handler) {
    const id = uid("file");
    const input = h("input", { id, class: "input", type: "file", accept });
    const warn = h("div", { class: "notice warn", role: "alert", hidden: true });
    const button = h("button", { class: "btn primary", type: "button", disabled: true, text: buttonLabel });
    input.addEventListener("change", () => {
      button.disabled = !input.files.length;
      warn.hidden = true;
    });
    button.addEventListener("click", () => handler(input, button, warn));
    return h("div", { class: "card" },
      h("h3", { text: title }),
      h("p", { class: "hint flush", text: hint }),
      field(id, "Bestand kiezen", input),
      warn,
      h("div", { class: "actions" }, button),
    );
  }

  async function importInvoice(input, button, warn) {
    const file = input.files[0];
    if (!file) return;
    button.disabled = true;
    warn.hidden = true;
    try {
      const xml = await readFileText(file);
      const result = await api("/api/invoices/import", { method: "POST", body: JSON.stringify({ xml }) });
      toast("Factuur geïmporteerd");
      location.hash = `factuur/${encodeURIComponent(result.id)}`;
    } catch (error) {
      if (error.status === 422 && error.problems.length) {
        warn.replaceChildren(
          h("div", {},
            h("strong", { text: "Factuur niet geïmporteerd" }),
            h("ul", {}, error.problems.map((p) => h("li", { text: p }))),
          ),
        );
        warn.hidden = false;
      } else {
        toast(error.message, true);
      }
      button.disabled = !input.files.length;
    }
  }

  async function importBank(input, button, warn) {
    const file = input.files[0];
    if (!file) return;
    button.disabled = true;
    warn.hidden = true;
    try {
      const csv = await readFileText(file);
      const result = await api("/api/invoices/bank", { method: "POST", body: JSON.stringify({ csv }) });
      const matched = result.matched || [];
      toast(matched.length
        ? `${matched.length} ${matched.length === 1 ? "factuur" : "facturen"} als betaald gemarkeerd: ${matched.join(", ")}`
        : "Geen openstaande facturen gevonden in het bankbestand");
      input.value = "";
      await refresh();
    } catch (error) {
      toast(error.message, true);
    } finally {
      button.disabled = !input.files.length;
    }
  }

  async function openPeppolOverview(routeId) {
    state.reader = "peppol";
    state.selectedInvoice = null;
    setReader(loadingNode("Laden…"));
    let settings = {};
    try { settings = await api("/api/settings"); } catch (_) { /* pagina werkt ook zonder */ }
    if (routeId !== state.routeId) return;
    const path = settings.peppol_map || "";
    const connected = Boolean(settings.peppol_connected);
    const copy = h("button", { class: "btn small", type: "button", text: "Kopieer pad", onclick: () => copyText(path) });
    const status = connected
      ? h("div", { class: "notice info" }, h("div", { text: "Er is een Peppol access point gekoppeld. Betaalde facturen worden automatisch verzonden." }))
      : h("div", { class: "notice warn" }, h("div", {},
          h("div", { text: "Er is nog geen Peppol access point gekoppeld; facturen komen in de map:" }),
          h("div", { class: "path-row" }, h("code", { class: "path", text: path || "(niet ingesteld)" }), path ? copy : null),
        ));
    setReader(h("div", { class: "reader-inner" },
      h("h1", { text: "Peppol-facturen" }),
      h("p", { class: "section-intro", text: "Facturen gaan via Peppol zodra de betaling binnen is. Markeer een factuur als betaald of importeer een bankbestand; de factuur wordt dan verzonden." }),
      status,
      h("div", { class: "grid-2" },
        importCard("Factuur importeren", "Importeer een UBL-factuur (.xml). Ongeldige facturen worden niet opgeslagen.", ".xml,text/xml,application/xml", "Factuur importeren", importInvoice),
        importCard("Bankbestand importeren", "Facturen worden als betaald gemarkeerd wanneer het factuurnummer en het exacte bedrag in het bankbestand staan.", ".csv,text/csv", "Bankbestand importeren", importBank),
      ),
    ));
  }

  async function invoiceAction(id, action, message, button) {
    if (button) button.disabled = true;
    try {
      await api(`/api/invoices/${encodeURIComponent(id)}/${action}`, { method: "POST" });
      toast(message);
      await refresh();
    } catch (error) {
      toast(error.message, true);
      if (button) button.disabled = false;
    }
  }

  async function openInvoice(id, routeId) {
    const key = String(id);
    state.reader = "invoice";
    state.selected = null;
    state.selectedInvoice = key;
    highlightItems();
    setReader(loadingNode("Factuur openen…"));
    try {
      const invoice = await api(`/api/invoices/${encodeURIComponent(key)}`);
      if (routeId !== state.routeId) return;
      renderInvoice(invoice);
    } catch (error) {
      if (routeId !== state.routeId) return;
      setReader(errorNode("Kon de factuur niet openen", error.message));
    }
  }

  function renderInvoice(inv) {
    const rows = [
      ["Koper", inv.buyer_name],
      ["Peppol-adres", inv.buyer_endpoint],
      ["Factuurdatum", formatDate(inv.issue_date)],
      ["Vervaldatum", formatDate(inv.due_date)],
      ["Totaal", money(inv.total_incl, inv.currency)],
      ["Betaald op", inv.paid_at ? formatFull(inv.paid_at) : ""],
      ["Verzonden op", inv.sent_at ? formatFull(inv.sent_at) : ""],
    ].filter(([, value]) => value);

    const markPaid = inv.status === "wacht op betaling"
      ? h("button", { class: "btn primary", type: "button", text: "Markeer als betaald" }) : null;
    const send = (inv.status === "in map" || inv.status === "te verzenden")
      ? h("button", { class: "btn primary", type: "button", text: inv.status === "in map" ? "Opnieuw verzenden" : "Verzenden" }) : null;
    if (markPaid) markPaid.addEventListener("click", () => invoiceAction(inv.id, "mark-paid", "Factuur als betaald gemarkeerd", markPaid));
    if (send) send.addEventListener("click", () => invoiceAction(inv.id, "send", "Verzending gestart", send));

    setReader(h("div", { class: "reader-inner" },
      h("h1", { text: `Factuur ${inv.number}` }),
      h("div", { class: "meta" }, statusChip(inv.status)),
      h("div", { class: "card mt" },
        h("h3", { text: "Gegevens" }),
        h("dl", { class: "kv" }, rows.flatMap(([k, v]) => [h("dt", { text: k }), h("dd", { text: String(v) })])),
      ),
      inv.last_error ? h("div", { class: "notice warn" }, h("div", {},
        h("strong", { text: "Laatste fout" }),
        h("div", { text: inv.last_error }),
      )) : null,
      h("div", { class: "actions" }, markPaid, send),
      h("details", { class: "card activity" },
        h("summary", { text: "Bekijk XML" }),
        h("pre", { class: "xml", text: inv.xml || "(geen XML opgeslagen)" }),
      ),
    ));
  }

  /* ---------- herinneringen ---------- */

  async function loadReminderList() {
    const loadId = ++state.loadId;
    $("#list-title").textContent = "Herinneringen";
    try {
      const reminders = await api("/api/reminders");
      if (loadId !== state.loadId) return;
      state.reminders = reminders;
      state.reminderCount = reminders.length;
      renderNav();
      renderReminderList();
    } catch (error) {
      if (loadId !== state.loadId) return;
      $("#list-sub").textContent = `Kon de herinneringen niet laden: ${error.message}`;
    }
  }

  function renderReminderList() {
    const items = state.reminders.filter((r) => matchesQuery(r.number, r.buyer_name));
    const n = items.length;
    $("#list-sub").textContent = n === 0
      ? (state.query ? "Geen resultaten" : "Niets te doen")
      : `${n} ${n === 1 ? "herinnering wacht" : "herinneringen wachten"} op goedkeuring`;
    if (n === 0) {
      $("#items").replaceChildren(h("div", {
        class: "loading",
        text: state.query ? "Geen herinneringen gevonden." : "Er wachten geen herinneringen op goedkeuring.",
      }));
      return;
    }
    $("#items").replaceChildren(...items.map((r) => h("button", {
      class: "item",
      type: "button",
      role: "option",
      "aria-selected": String(r.id) === state.selectedReminder ? "true" : "false",
      "data-reminder": String(r.id),
      onclick: () => { location.hash = `herinnering/${encodeURIComponent(r.id)}`; },
    },
      h("div", { class: "item-top" },
        h("span", { class: "item-sender", text: r.buyer_name || "(onbekende koper)" }),
        h("span", { text: money(r.amount, r.currency) }),
      ),
      h("div", { class: "item-subject", text: `Factuur ${r.number}` }),
      h("div", { class: "item-summary", text: r.due_date ? `Vervalt ${formatDate(r.due_date)}` : "" }),
      h("div", { class: "chip-row" },
        r.recipient ? null : h("span", { class: "chip klacht", text: "Geen adres bekend" }),
      ),
    )));
  }

  async function openReminder(id, routeId) {
    const key = String(id);
    state.reader = "reminder";
    state.selected = null;
    state.selectedClient = null;
    state.selectedInvoice = null;
    state.selectedReminder = key;
    highlightItems();
    setReader(loadingNode("Herinnering openen…"));
    try {
      const reminders = await api("/api/reminders");
      if (routeId !== state.routeId) return;
      const reminder = reminders.find((r) => String(r.id) === key);
      if (!reminder) {
        setReader(errorNode("Deze herinnering staat niet meer open", "Ze is al verzonden of afgewezen."));
        return;
      }
      renderReminder(reminder);
    } catch (error) {
      if (routeId !== state.routeId) return;
      setReader(errorNode("Kon de herinnering niet openen", error.message));
    }
  }

  function renderReminder(r) {
    const id = String(r.id);
    const noAddress = !r.recipient;
    const textarea = h("textarea", { class: "input", rows: "10", "aria-label": "Tekst van de herinnering" });
    textarea.value = r.body || "";
    const reject = h("button", { class: "btn danger", type: "button", text: "Afwijzen" });
    const approve = h("button", { class: "btn primary", type: "button", text: "Goedkeuren en verzenden", disabled: noAddress });
    reject.addEventListener("click", () => rejectReminder(id, reject));
    approve.addEventListener("click", () => approveReminder(id, textarea, approve));

    const rows = [
      ["Klant", r.buyer_name || "(onbekend)"],
      ["Factuur", r.number],
      ["Bedrag", money(r.amount, r.currency)],
      ["Vervaldatum", formatDate(r.due_date)],
      ["Ontvanger", r.recipient || "Geen adres bekend"],
      ["Onderwerp", r.subject],
    ].filter(([, value]) => value);

    setReader(h("div", { class: "reader-inner" },
      h("a", { class: "link back", href: "#herinneringen", text: "← Alle herinneringen" }),
      h("h1", { text: `Herinnering factuur ${r.number}` }),
      h("div", { class: "meta" }, h("span", { class: "chip wacht", text: "Wacht op goedkeuring" })),
      noAddress ? h("div", { class: "notice warn" }, h("div", {},
        h("strong", { text: "Geen adres bekend" }),
        h("div", { text: "Werker kan deze herinnering niet verzenden: er is geen e-mailadres bekend voor deze klant. Wijs de herinnering af of neem zelf contact op." }),
      )) : null,
      h("div", { class: "card mt" },
        h("h3", { text: "Gegevens" }),
        h("dl", { class: "kv" }, rows.flatMap(([k, value]) => [h("dt", { text: k }), h("dd", { text: String(value) })])),
      ),
      h("div", { class: "card draft" },
        h("h3", { text: "Tekst van de herinnering" }),
        textarea,
        h("div", { class: "hint", text: "Wijzig de tekst gerust. Er wordt pas verzonden na goedkeuring." }),
      ),
      r.last_error ? h("div", { class: "notice warn" }, h("div", {},
        h("strong", { text: "Laatste fout" }),
        h("div", { text: r.last_error }),
      )) : null,
      h("div", { class: "actions" }, reject, h("span", { class: "spacer" }), approve),
    ));
  }

  async function approveReminder(id, textarea, button) {
    const body = textarea.value.trim();
    if (!body) { toast("De tekst is leeg.", true); return; }
    button.disabled = true;
    try {
      await api(`/api/reminders/${encodeURIComponent(id)}/approve`, { method: "POST", body: JSON.stringify({ body }) });
      toast("Herinnering verzonden");
      location.hash = "herinneringen";
      loadStats().catch(() => {});
    } catch (error) {
      toast(error.message, true);
      button.disabled = false;
    }
  }

  async function rejectReminder(id, button) {
    if (!confirm("Deze herinnering afwijzen? Er wordt niets verzonden.")) return;
    button.disabled = true;
    try {
      await api(`/api/reminders/${encodeURIComponent(id)}/reject`, { method: "POST" });
      toast("Herinnering afgewezen");
      location.hash = "herinneringen";
      loadStats().catch(() => {});
    } catch (error) {
      toast(error.message, true);
      button.disabled = false;
    }
  }

  /* ---------- rapporten ---------- */

  function formatMinutes(minutes) {
    if (minutes === null || minutes === undefined) return "—";
    if (minutes < 60) return `${Math.round(minutes)} min`;
    return `${(minutes / 60).toLocaleString("nl-NL", { maximumFractionDigits: 1 })} uur`;
  }

  function statCard(label, value, { hint = "", warn = false, lines = [] } = {}) {
    return h("div", { class: "card" },
      h("h3", { text: label }),
      h("div", { class: `stat-value${warn ? " warn" : ""}`, text: value }),
      lines.length ? h("ul", { class: "stat-list" },
        lines.map(([k, v]) => h("li", {}, h("span", { text: k }), h("strong", { text: v })))) : null,
      hint ? h("p", { class: "stat-hint", text: hint }) : null,
    );
  }

  async function openReports(routeId) {
    state.reader = "reports";
    state.selected = null;
    state.selectedClient = null;
    state.selectedInvoice = null;
    state.selectedReminder = null;
    highlightItems();
    $("#list-title").textContent = "Rapporten";
    $("#list-sub").textContent = `Laatste ${state.reportDays} dagen`;
    $("#items").replaceChildren(h("div", { class: "loading", text: "Overzicht van berichten, reactietijd en facturen." }));
    setReader(loadingNode("Rapporten laden…"));
    try {
      const data = await api(`/api/reports?days=${state.reportDays}`);
      if (routeId !== state.routeId) return;
      renderReports(data);
    } catch (error) {
      if (routeId !== state.routeId) return;
      setReader(errorNode("Kon de rapporten niet laden", error.message));
    }
  }

  function renderReports(d) {
    const days = d.dagen || state.reportDays;
    const messages = d.berichten || {};
    const response = d.responstijd || {};
    const open = d.openstaand || {};
    const overdue = d.verlopen || {};
    const overdueCount = Number(overdue.aantal) || 0;
    const perChannel = Object.entries(messages.per_kanaal || {}).sort((a, b) => b[1] - a[1])
      .map(([key, count]) => [channelLabel(key), String(count)]);
    const perIntent = Object.entries(messages.per_intentie || {}).sort((a, b) => b[1] - a[1])
      .map(([key, count]) => `${key === "onbekend" ? "Onbekend" : (INTENT_LABELS[key] || key)} ${count}`);
    const periods = [7, 30, 90].map((n) => h("button", {
      class: "seg-btn",
      type: "button",
      "aria-pressed": n === state.reportDays ? "true" : "false",
      text: `${n} dagen`,
      onclick: () => { state.reportDays = n; openReports(state.routeId); },
    }));

    setReader(h("div", { class: "reader-inner" },
      h("h1", { text: "Rapporten" }),
      h("p", { class: "section-intro", text: `Overzicht van de laatste ${days} dagen. Facturen tellen mee zoals ze nu staan.` }),
      h("div", { class: "seg", role: "group", "aria-label": "Periode" }, periods),
      h("div", { class: "stat-grid mt" },
        statCard("Berichten", String(messages.totaal ?? 0), {
          lines: perChannel,
          hint: perIntent.length ? `Onderwerpen: ${perIntent.join(", ")}` : "Geen berichten in deze periode.",
        }),
        statCard("Gemiddelde reactietijd", formatMinutes(response.gemiddeld_minuten), {
          hint: [response.toelichting, response.antwoorden ? `Gebaseerd op ${response.antwoorden} antwoorden.` : ""]
            .filter(Boolean).join(" "),
        }),
        statCard("Prijsvragen beantwoord", String(d.prijsvragen_beantwoord ?? 0), {
          hint: "Prijsvragen waar in deze periode een antwoord op is verstuurd.",
        }),
        statCard("Openstaande facturen", String(open.aantal ?? 0), {
          lines: [["Totaal", money(open.totaal, "EUR")]],
          hint: "Facturen die wachten op betaling of nog verzonden moeten worden.",
        }),
        statCard("Verlopen facturen", String(overdueCount), {
          warn: overdueCount > 0,
          lines: [["Totaal", money(overdue.totaal, "EUR")]],
          hint: "De vervaldatum is voorbij en de factuur is nog niet betaald.",
        }),
      ),
      renderAiReport(d.ai),
    ));
  }

  function renderAiReport(ai) {
    if (!ai) return null;
    const count = (n) => (Number(n) || 0).toLocaleString("nl-NL");
    const models = Object.entries(ai.per_model || {}).sort((a, b) => (b[1].aanroepen || 0) - (a[1].aanroepen || 0));
    const hasCost = ai.geschatte_kosten !== null && ai.geschatte_kosten !== undefined;
    const pricesLink = h("a", {
      class: "link", href: "#instellingen", text: "Prijzen instellen",
      onclick: () => { state.settingsFocus = SECTION_IDS.AI; },
    });
    const table = models.length
      ? h("div", { class: "table-wrap" }, h("table", { class: "data" },
          h("thead", {}, h("tr", {},
            h("th", { scope: "col", text: "Model" }),
            h("th", { scope: "col", class: "num", text: "Aanroepen" }),
            h("th", { scope: "col", class: "num", text: "Invoertokens" }),
            h("th", { scope: "col", class: "num", text: "Uitvoertokens" }),
          )),
          h("tbody", {}, models.map(([model, row]) => h("tr", {},
            h("td", { text: model }),
            h("td", { class: "num", text: count(row.aanroepen) }),
            h("td", { class: "num", text: count(row.invoer_tokens) }),
            h("td", { class: "num", text: count(row.uitvoer_tokens) }),
          ))),
        ))
      : h("p", { class: "hint flush", text: "Geen AI-aanroepen in deze periode." });
    return h("section", { class: "mt", "aria-labelledby": "ai-report-title" },
      h("h2", { class: "section-title", id: "ai-report-title", text: "AI-gebruik" }),
      h("p", { class: "section-intro", text: "Hoe vaak Werker het taalmodel gebruikte om berichten in te delen en concepten te schrijven." }),
      h("div", { class: "stat-grid" },
        statCard("AI-aanroepen", count(ai.aanroepen), {
          lines: [["Invoertokens", count(ai.invoer_tokens)], ["Uitvoertokens", count(ai.uitvoer_tokens)]],
        }),
        h("div", { class: "card" },
          h("h3", { text: "Geschatte kosten" }),
          h("div", { class: "stat-value", text: hasCost ? money(ai.geschatte_kosten, "EUR") : "—" }),
          h("p", { class: "stat-hint", text: hasCost ? (ai.toelichting || "") : "Er zijn nog geen prijzen ingesteld, dus er is geen schatting." }),
          hasCost ? null : h("p", { class: "stat-hint" }, pricesLink),
        ),
      ),
      h("div", { class: "card mt" }, h("h3", { text: "Per model" }), table),
    );
  }

  /* ---------- klantgegevens exporteren en verwijderen ---------- */

  async function exportClient(id, button) {
    button.disabled = true;
    try {
      const response = await fetch(`/api/clients/${encodeURIComponent(id)}/export`);
      if (!response.ok) {
        const data = await response.json().catch(() => null);
        throw new Error((data && typeof data.detail === "string" && data.detail) || "Export mislukt");
      }
      const blob = await response.blob();
      const url = URL.createObjectURL(blob);
      const link = h("a", { href: url, download: `werker-klant-${id}.json`, hidden: true });
      document.body.append(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      toast("Export gedownload");
    } catch (error) {
      toast(error.message, true);
    } finally {
      button.disabled = false;
    }
  }

  function openEraseDialog(id, name) {
    const titleId = uid("erase");
    const input = h("input", { id: uid("erase-name"), class: "input", type: "text", autocomplete: "off" });
    const cancel = h("button", { class: "btn", type: "button", text: "Annuleren" });
    const confirmButton = h("button", { class: "btn danger", type: "button", disabled: true, text: "Definitief verwijderen" });
    const matches = () => input.value.trim() === name.trim();
    const dialog = h("dialog", { class: "confirm", "aria-labelledby": titleId },
      h("h2", { id: titleId, text: "Klant verwijderen" }),
      h("p", { text: `Je verwijdert ${name}. Dan verdwijnen de klant en alles wat daarbij hoort: berichten, concepten, contactgegevens en activiteit. Facturen blijven bewaard, maar de naam van de koper wordt op de factuur vervangen door “verwijderd”.` }),
      h("p", { text: "Dit kun je niet ongedaan maken. Exporteer de gegevens eerst als je een kopie wilt bewaren." }),
      h("div", { class: "field" },
        h("label", { for: input.id, text: `Typ de naam van de klant om te bevestigen: ${name}` }),
        input,
      ),
      h("div", { class: "actions" }, cancel, confirmButton),
    );
    input.addEventListener("input", () => { confirmButton.disabled = !matches(); });
    cancel.addEventListener("click", () => dialog.close());
    confirmButton.addEventListener("click", async () => {
      confirmButton.disabled = true;
      try {
        await api(`/api/clients/${encodeURIComponent(id)}`, {
          method: "DELETE",
          body: JSON.stringify({ confirm: input.value }),
        });
        dialog.close();
        toast("Klant verwijderd");
        loadStats().catch(() => {});
        location.hash = "klanten";
      } catch (error) {
        toast(error.message, true);
        confirmButton.disabled = !matches();
      }
    });
    dialog.addEventListener("close", () => dialog.remove());
    document.body.append(dialog);
    dialog.showModal();
    input.focus();
  }

  /* ---------- data verversen ---------- */

  async function loadStats() {
    const [stats, toSend, inMap, reminders] = await Promise.all([
      api("/api/stats"),
      api(`/api/invoices?status=${encodeURIComponent("te verzenden")}`).catch(() => []),
      api(`/api/invoices?status=${encodeURIComponent("in map")}`).catch(() => []),
      api("/api/reminders").catch(() => null),
    ]);
    state.stats = stats;
    state.invoiceCount = toSend.length + inMap.length;
    if (reminders) state.reminderCount = reminders.length;
    renderNav();
  }

  // Laadt de lijst die bij de huidige weergave hoort (berichten, klanten, facturen of herinneringen).
  function loadCurrentList() {
    if (state.listMode === "clients") return loadClients();
    if (state.listMode === "invoices") return loadInvoiceList();
    if (state.listMode === "reminders") return loadReminderList();
    if (state.listMode === "reports") return Promise.resolve();
    return loadList();
  }

  async function refresh() {
    try {
      await loadStats();
      if (state.listMode === "reports") {
        if (state.reader === "reports") await openReports(state.routeId);
      } else {
        await loadCurrentList();
      }
      if (state.reader === "message" && state.selected !== null) await selectMessage(state.selected);
      if (state.reader === "invoice" && state.selectedInvoice !== null) await openInvoice(state.selectedInvoice, state.routeId);
    } catch (error) {
      toast(error.message, true);
    }
  }

  /* ---------- routing (hash) ---------- */

  function parseRoute() {
    const raw = location.hash.replace(/^#/, "");
    const slash = raw.indexOf("/");
    const head = slash === -1 ? raw : raw.slice(0, slash);
    let arg = slash === -1 ? "" : raw.slice(slash + 1);
    try { arg = decodeURIComponent(arg); } catch (_) { /* laat ruwe waarde staan */ }
    if (head === "klanten") return { view: "clients" };
    if (head === "klant" && arg) return { view: "client", id: arg };
    if (head === "bericht" && arg) return { view: "message", id: arg };
    if (head === "instellingen") return { view: "settings" };
    if (head === "herinneringen") return { view: "reminders" };
    if (head === "herinnering" && arg) return { view: "reminder", id: arg };
    if (head === "rapporten") return { view: "reports" };
    if (head === "peppol") {
      const slug = INVOICE_TABS.some((t) => t.slug === arg) ? arg : "wacht-op-betaling";
      return { view: "invoices", tab: slug };
    }
    if (head === "factuur" && arg) return { view: "invoice", id: arg };
    const tab = TABS.find((t) => t.id === head);
    return { view: "messages", tab: tab ? tab.id : "pending" };
  }

  function showEmptyReader() {
    state.reader = "empty";
    const mode = state.listMode;
    const hint = mode === "clients" ? "Kies een klant uit de lijst."
      : mode === "reminders" ? "Kies een herinnering uit de lijst."
      : h("div", {}, "Gebruik ", h("kbd", { text: "j" }), " en ", h("kbd", { text: "k" }), " om door de lijst te bewegen.");
    const title = mode === "clients" ? "Geen klant geopend"
      : mode === "reminders" ? "Geen herinnering geopend" : "Kies een bericht";
    setReader(h("div", { class: "empty" }, h("div", {}, svgIcon(mode === "clients" ? "users" : mode === "reminders" ? "bell" : "mail", "icon empty-icon"), h("h3", { text: title }), hint)));
  }

  async function onRoute() {
    const route = parseRoute();
    const routeId = ++state.routeId;

    if (route.view === "messages") {
      Object.assign(state, { listMode: "messages", tab: route.tab, selected: null, selectedClient: null });
      renderNav(); updatePlaceholder();
      showEmptyReader();
      await loadList();
    } else if (route.view === "clients") {
      Object.assign(state, { listMode: "clients", selected: null, selectedClient: null });
      renderNav(); updatePlaceholder();
      showEmptyReader();
      await loadClients();
    } else if (route.view === "client") {
      Object.assign(state, { listMode: "clients", selected: null, selectedClient: String(route.id) });
      renderNav(); updatePlaceholder();
      await Promise.all([loadClients(), openClient(route.id, routeId)]);
    } else if (route.view === "message") {
      Object.assign(state, { listMode: "messages", selectedClient: null });
      renderNav(); updatePlaceholder();
      await Promise.all([loadList(), selectMessage(route.id)]);
    } else if (route.view === "invoices") {
      Object.assign(state, { listMode: "invoices", invTab: route.tab, selected: null, selectedClient: null, selectedInvoice: null });
      renderNav(); updatePlaceholder();
      await Promise.all([loadInvoiceList(), openPeppolOverview(routeId)]);
    } else if (route.view === "invoice") {
      Object.assign(state, { listMode: "invoices", selected: null, selectedClient: null, selectedInvoice: String(route.id) });
      renderNav(); updatePlaceholder();
      await Promise.all([loadInvoiceList(), openInvoice(route.id, routeId)]);
    } else if (route.view === "reminders") {
      Object.assign(state, { listMode: "reminders", selected: null, selectedClient: null, selectedInvoice: null, selectedReminder: null });
      renderNav(); updatePlaceholder();
      showEmptyReader();
      await loadReminderList();
    } else if (route.view === "reminder") {
      Object.assign(state, { listMode: "reminders", selected: null, selectedClient: null, selectedInvoice: null });
      renderNav(); updatePlaceholder();
      await Promise.all([loadReminderList(), openReminder(route.id, routeId)]);
    } else if (route.view === "reports") {
      Object.assign(state, { listMode: "reports", selected: null, selectedClient: null, selectedInvoice: null, selectedReminder: null });
      renderNav(); updatePlaceholder();
      await openReports(routeId);
    } else if (route.view === "settings") {
      Object.assign(state, { selected: null, selectedClient: null });
      renderNav(); updatePlaceholder();
      await Promise.all([loadCurrentList(), openSettings(routeId)]);
    }
  }

  /* ---------- toetsenbord ---------- */

  function moveSelection(step) {
    if (!state.messages.length) return;
    const index = state.messages.findIndex((m) => String(m.id) === state.selected);
    const next = state.messages[Math.min(Math.max(index + step, 0), state.messages.length - 1)];
    if (next) {
      selectMessage(next.id);
      document.querySelector(`.item[data-id="${CSS.escape(String(next.id))}"]`)?.scrollIntoView({ block: "nearest" });
    }
  }

  document.addEventListener("keydown", (event) => {
    const typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName || "");
    if (typing || event.metaKey || event.ctrlKey || event.altKey) return;
    if (event.key === "/") { event.preventDefault(); $("#q").focus(); return; }
    if (state.listMode !== "messages") return;
    if (event.key === "j") moveSelection(1);
    if (event.key === "k") moveSelection(-1);
  });

  /* ---------- zoeken & sync ---------- */

  let searchTimer;
  $("#q").addEventListener("input", (event) => {
    const value = event.target.value.trim();
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => {
      state.query = value;
      if (state.listMode === "clients") loadClients();
      else if (state.listMode === "invoices") renderInvoiceView();
      else if (state.listMode === "reminders") renderReminderList();
      else if (state.listMode === "messages") loadList();
    }, 250);
  });

  $("#sync").addEventListener("click", async (event) => {
    const button = event.currentTarget;
    const label = button.querySelector(".btn-label");
    button.disabled = true;
    label.textContent = "Bezig…";
    try {
      const result = await api("/api/sync", { method: "POST" });
      toast(result.processed ? `${result.processed} nieuwe berichten verwerkt` : "Geen nieuwe berichten");
      await refresh();
    } catch (error) {
      toast(error.message, true);
    } finally {
      button.disabled = false;
      label.textContent = "Synchroniseer";
    }
  });

  $("#settings-btn").addEventListener("click", () => {
    if (location.hash === "#instellingen") onRoute();
    else location.hash = "instellingen";
  });

  window.addEventListener("hashchange", onRoute);
  setInterval(() => { loadStats().catch(() => {}); }, 60000);

  if (!location.hash) history.replaceState(null, "", "#pending");
  loadStats().catch(() => {});
  api("/api/settings").then((data) => {
    applyTheme(data.values.WERKER_THEME);
    state.setup = setupStatus(data);
    placeSetupCard();
  }).catch(() => {});
  onRoute();
})();
</script>
</body>
</html>
